<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE DESIGN | 견적문의</title>

    <link rel="icon" href="https://i.imgur.com/f1j8a7x.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>
        body {
            font-family: "Pretendard", sans-serif;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }

        /* 기본 인풋 포맷팅 제거 */
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            border-radius: 0 !important;
            -webkit-appearance: none;
        }

        /* 커스텀 라디오 버튼 (문의유형) */
        .custom-radio {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #4b5563;
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            position: relative;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }
        .custom-radio:checked {
            background-color: #333333;
            border-color: #333333;
        }
        .custom-radio:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 2px;
            width: 5px;
            height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* 커스텀 체크박스 (개인정보방침) */
        .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #4b5563;
            border-radius: 0px;
            outline: none;
            cursor: pointer;
            position: relative;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }
        .custom-checkbox:checked {
            background-color: #333333;
            border-color: #333333;
        }
        .custom-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 2px;
            width: 5px;
            height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* 애니메이션 */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* ✨ 우측 하단 연락처 글자 색상 실시간 제어 스타일 */
        .dynamic-contact-text {
            color: #162e59;
            transition: color 0.3s ease;
        }
        /* 푸터(진한 파란 배경) 진입 시 반전될 흰색 클래스 */
        .dynamic-contact-text.footer-bg {
            color: #ffffff !important;
        }

        @media (max-width: 768px) {
            main {
                padding-top: 140px !important;
            }
            h1 {
                font-size: 38px !important;
                line-height: 1.3 !important;
            }
            
            .contact-box { right: 20px !important; bottom: 20px !important; }
            .contact-box p:first-child { font-size: 16px !important; }
        }
    </style>
</head>

<body class="bg-white text-gray-900">

    <div id="header"></div>

    <main class="pt-48 pb-32 px-6">

        <div class="max-w-5xl mx-auto">

            <div class="mb-10 reveal">
                <span class="text-sm font-bold tracking-[0.2em] text-gray-700 uppercase block mb-2">
                    CONTACT
                </span>
                <h1 class="text-4xl font-bold tracking-tight text-[#222751]">
                    견적문의
                </h1>
            </div>

            <form id="contactForm" class="bg-[#dbdbdb] p-8 md:p-14 space-y-7 reveal">

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 회사명 <span class="text-red-500 ml-1">*</span>
                    </label>
                    <input type="text" name="company_name" required class="w-full bg-white h-11 px-4 outline-none border-none text-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 이메일 <span class="text-red-500 ml-1">*</span>
                    </label>
                    <input type="email" name="user_email" required class="w-full bg-white h-11 px-4 outline-none border-none text-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 담당자명 <span class="text-red-500 ml-1">*</span>
                    </label>
                    <input type="text" name="manager_name" required class="w-full bg-white h-11 px-4 outline-none border-none text-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 연락처 <span class="text-red-500 ml-1">*</span>
                    </label>
                    <input type="tel" name="user_phone" required oninput="autoHyphenPhone(this)" maxlength="13" placeholder="휴대번호 또는 유선번호" class="w-full bg-white h-11 px-4 outline-none border-none text-sm placeholder-gray-400">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-start md:items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 문의유형 <span class="text-red-500 ml-1">*</span>
                    </label>
                    <div class="flex flex-wrap items-center gap-x-5 gap-y-3 text-sm font-bold text-gray-800">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="inquiry_type" value="사무공간 인테리어" required onchange="toggleEtcInput()" class="custom-radio"> 사무공간 인테리어
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="inquiry_type" value="상업공간 인테리어" required onchange="toggleEtcInput()" class="custom-radio"> 상업공간 인테리어
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="inquiry_type" value="이미지월/파사드" required onchange="toggleEtcInput()" class="custom-radio"> 이미지월/파사드
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="inquiry_type" value="철거" required onchange="toggleEtcInput()" class="custom-radio"> 철거
                        </label>
                        <div class="flex items-center gap-2">
                            <label class="flex items-center gap-2 cursor-pointer whitespace-nowrap">
                                <input type="radio" name="inquiry_type" id="inquiry_type_etc" value="기타" required onchange="toggleEtcInput()" class="custom-radio"> 기타
                            </label>
                            <input type="text" name="inquiry_etc_text" id="inquiry_etc_text" placeholder="기타 내용을 적어주세요." class="hidden bg-white h-9 px-3 outline-none border-none text-sm font-normal text-gray-700 w-44 sm:w-52 placeholder-gray-400">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 회사위치
                    </label>
                    <input type="text" name="company_location" placeholder="주소 또는 구/동" class="w-full bg-white h-11 px-4 outline-none border-none text-sm placeholder-gray-400">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 현장위치
                    </label>
                    <input type="text" name="site_location" placeholder="주소 또는 구/동" class="w-full bg-white h-11 px-4 outline-none border-none text-sm placeholder-gray-400">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 현장규모
                    </label>
                    <input type="text" name="site_size" placeholder="가로 x 세로 x 높이 / 평수" class="w-full bg-white h-11 px-4 outline-none border-none text-sm placeholder-gray-400">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 방문상담/실측 희망일
                    </label>
                    <input type="text" name="visit_date" class="w-full bg-white h-11 px-4 outline-none border-none text-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 추정예산 (단위: 원)
                    </label>
                    <input type="text" name="budget_range" oninput="autoCommaBudget(this)" placeholder="예: 50,000,000 (숫자 입력 시 쉼표가 자동 부여됩니다.)" class="w-full bg-white h-11 px-4 outline-none border-none text-sm placeholder-gray-400">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 공사희망일~완료일
                    </label>
                    <input type="text" name="construction_period" class="w-full bg-white h-11 px-4 outline-none border-none text-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-start gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center pt-2">
                        <span class="mr-1.5">•</span> 기타사항
                    </label>
                    <textarea name="etc_memo" rows="6" placeholder="상세히 적어주시면 상담에 큰 도움이 됩니다." class="w-full bg-white p-4 text-sm outline-none border-none resize-none placeholder-gray-400 leading-relaxed"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-start gap-2 md:gap-4 pt-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 개인정보방침 <span class="text-red-500 ml-1">*</span>
                    </label>
                    <div class="flex items-start gap-3 text-xs md:text-sm text-gray-600 font-medium leading-tight">
                        <input type="checkbox" id="privacy" required class="custom-checkbox mt-0.5">
                        <label for="privacy" class="cursor-pointer select-none">
                            동의합니다. (수집항목: 고객명, 전화번호, 메일 / 이용목적: 견적상담 / 보유기간: 3개월 이내)
                        </label>
                    </div>
                </div>

                <div class="text-center pt-8">
                    <button type="submit" class="bg-[#292552] text-white text-sm font-bold px-10 py-3.5 hover:bg-[#1f1b3e] transition-all tracking-wider">
                        문의하기
                    </button>
                </div>

            </form>

        </div>

    </main>

    <div class="contact-box fixed bottom-10 right-10 z-[99999] flex flex-col items-end select-none">
        <div id="dynamic-text-target" class="dynamic-contact-text mb-5 flex flex-col items-end text-right">
            <p class="text-[21px] font-black tracking-tighter">010-4192-0882</p>
            <p class="text-sm font-light opacity-90 tracking-[0.055em] mr-[-0.055em]">camp0882@daum.net</p>
        </div>
        <div class="flex justify-end gap-3">
            <a href="javascript:void(0);" onclick="openNaverBlog();" class="w-10 h-10 rounded-full bg-[#03C75A] flex items-center justify-center text-white text-[10px] font-bold uppercase hover:scale-105 shadow-lg transition-transform">
                BLOG
            </a>
            
            <a href="http://pf.kakao.com/_AJxenX" target="_blank" rel="noopener noreferrer" class="w-10 h-10 rounded-full bg-[#fae100] flex items-center justify-center overflow-hidden hover:scale-105 shadow-lg transition-transform">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/KakaoTalk_logo.svg" alt="카카오톡" class="w-5 h-5 object-contain">
            </a>

            <a href="javascript:void(0);" onclick="copyEmail();" class="w-10 h-10 rounded-full bg-white border border-gray-100 flex items-center justify-center text-[#1e3a8a] hover:scale-105 shadow-lg transition-transform" title="이메일 주소 복사">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
            </a>
        </div>
    </div>

    <div id="footer"></div>

    <script>
        // 1. EmailJS 초기화 설정
        (function() {
            emailjs.init("sz8Xrb2U1XmDIarMr"); 
        })();

        // header/footer 불러오기
        fetch('./components/header.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('header').innerHTML = data;
        });

        fetch('./components/footer.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        });

        window.toggleMenu = function () {
            const menu = document.getElementById("mobileMenu");
            if(menu){
                menu.classList.toggle("hidden");
            }
        };

        // 📞 연락처 자동 하이픈(-) 포맷팅 함수
        function autoHyphenPhone(target) {
            let val = target.value.replace(/[^0-9]/g, ''); 
            let res = '';

            if (val.startsWith('02')) {
                if (val.length < 3) res = val;
                else if (val.length < 6) res = val.substr(0, 2) + '-' + val.substr(2);
                else if (val.length < 10) res = val.substr(0, 2) + '-' + val.substr(2, 3) + '-' + val.substr(5);
                else res = val.substr(0, 2) + '-' + val.substr(2, 4) + '-' + val.substr(6, 4);
            } 
            else {
                if (val.length < 4) res = val;
                else if (val.length < 7) res = val.substr(0, 3) + '-' + val.substr(3);
                else if (val.length < 11) res = val.substr(0, 3) + '-' + val.substr(3, 3) + '-' + val.substr(6);
                else res = val.substr(0, 3) + '-' + val.substr(3, 4) + '-' + val.substr(7, 4);
            }
            target.value = res;
        }

        // 💰 추정예산 3자리 단위 자동 쉼표(,) 포맷팅 함수
        function autoCommaBudget(target) {
            let val = target.value.replace(/[^0-9]/g, ''); 
            if (val === '') {
                target.value = '';
                return;
            }
            target.value = Number(val).toLocaleString(); 
        }

        // '기타' 라디오 버튼 클릭 시 텍스트 창 제어 함수
        function toggleEtcInput() {
            const etcRadio = document.getElementById('inquiry_type_etc');
            const etcInput = document.getElementById('inquiry_etc_text');

            if (etcRadio.checked) {
                etcInput.classList.remove('hidden'); 
                etcInput.setAttribute('required', 'true');
                etcInput.focus();
            } else {
                etcInput.classList.add('hidden'); 
                etcInput.removeAttribute('required');
                etcInput.value = '';
            }
        }

        // 문의하기 폼 Submit (이메일 전송 처리)
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const formData = new FormData(this);

            let finalInquiryType = formData.get('inquiry_type');
            if (finalInquiryType === '기타') {
                finalInquiryType = '기타: ' + formData.get('inquiry_etc_text');
            }

            let rawBudget = formData.get('budget_range');
            let finalBudget = rawBudget ? rawBudget + '원' : '미기입';

            const templateParams = {
                company_name: formData.get('company_name'),
                user_email: formData.get('user_email'),
                manager_name: formData.get('manager_name'),
                user_phone: formData.get('user_phone'),
                inquiry_type: finalInquiryType,
                company_location: formData.get('company_location'),
                site_location: formData.get('site_location'),
                site_size: formData.get('site_size'),
                visit_date: formData.get('visit_date'),
                budget_range: finalBudget, 
                construction_period: formData.get('construction_period'),
                etc_memo: formData.get('etc_memo')
            };

            emailjs.send('service_wsz5497', 'template_a35v7vi', templateParams)
                .then(function() {
                    alert('견적 문의가 정상적으로 전송되었습니다. 확인 후 빠른 시일 내에 연락드리겠습니다.');
                    document.getElementById('contactForm').reset();
                    toggleEtcInput(); 
                }, function(error) {
                    alert('메일 전송에 실패했습니다. 다시 시도해 주시거나 대표 번호로 문의 바랍니다. 에러: ' + JSON.stringify(error));
                });
        });

        // 스크롤 감지 글자 색상 실시간 제어
        function checkScrollContact() {
            const windowHeight = window.innerHeight;
            const textTarget = document.getElementById('dynamic-text-target');
            const footer = document.getElementById('footer');

            if (textTarget && footer) {
                const footerTop = footer.getBoundingClientRect().top;
                
                if (footerTop < windowHeight - 150) {
                    textTarget.classList.add('footer-bg');
                } else {
                    textTarget.classList.remove('footer-bg');
                }
            }
        }

        function openNaverBlog() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            let blogUrl = isMobile 
                ? "https://m.blog.naver.com/zinux_?noTrackingCode=true&proxyReferer=&tab=1" 
                : "https://blog.naver.com/zinux_";
            window.open(blogUrl, '_blank');
        }

        // ✨ 이메일 복사 함수 추가
        window.copyEmail = function() {
            const email = "camp0882@daum.net";
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(email).then(() => {
                    alert("이메일 주소(" + email + ")가 복사되었습니다.");
                }).catch(() => fallbackCopyTextToClipboard(email));
            } else {
                fallbackCopyTextToClipboard(email);
            }
        };

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "absolute";
            textArea.style.left = "-999999px"; 
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    alert("이메일 주소(" + text + ")가 복사되었습니다.");
                } else {
                    alert("복사 실패. 이메일 주소를 직접 복사해주세요: " + text);
                }
            } catch (err) {
                alert("이 환경에서는 복사가 지원되지 않습니다: " + text);
            }
            
            document.body.removeChild(textArea);
        }

        window.addEventListener('scroll', () => {
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach(el => {
                const windowHeight = window.innerHeight;
                const revealTop = el.getBoundingClientRect().top;
                if (revealTop < windowHeight - 100) {
                    el.classList.add('active');
                }
            });
            checkScrollContact();
        });

        window.addEventListener('resize', checkScrollContact);
        window.dispatchEvent(new Event('scroll'));
        setTimeout(checkScrollContact, 400);
    </script>

</body>
</html>
