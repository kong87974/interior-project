<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE DESIGN | 견적문의</title>

    <!-- 🌐 [아이콘 고정] 다른 서브 페이지와 동일한 로고 파비콘 링크를 추가했습니다 -->
    <link rel="icon" href="https://i.imgur.com/f1j8a7x.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>
        body {
            font-family: "Pretendard", sans-serif;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }

        /* 기본 인풋 포맷팅 제거 */
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            border-radius: 0 !important;
            -webkit-appearance: none;
        }

        /* 슬라이더(range) 스타일 커스텀 */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #4b5563;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #4b5563;
            cursor: pointer;
        }

        /* 커스텀 라디오 버튼 (문의유형) */
        .custom-radio {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #4b5563;
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            position: relative;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }
        .custom-radio:checked {
            background-color: #333333;
            border-color: #333333;
        }
        .custom-radio:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 2px;
            width: 5px;
            height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* 커스텀 체크박스 (개인정보방침) */
        .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #4b5563;
            border-radius: 0px;
            outline: none;
            cursor: pointer;
            position: relative;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }
        .custom-checkbox:checked {
            background-color: #333333;
            border-color: #333333;
        }
        .custom-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 2px;
            width: 5px;
            height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* 애니메이션 */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* ✨ 우측 하단 연락처 글자 색상 실시간 제어 스타일 (서브 페이지는 파란색 시작이 기본) */
        .dynamic-contact-text {
            color: #162e59;
            transition: color 0.3s ease;
        }
        /* 푸터(진한 파란 배경) 진입 시 반전될 흰색 클래스 */
        .dynamic-contact-text.footer-bg {
            color: #ffffff !important;
        }

        @media (max-width: 768px) {
            main {
                padding-top: 140px !important;
            }
            h1 {
                font-size: 38px !important;
                line-height: 1.3 !important;
            }
            
            .contact-box { right: 20px !important; bottom: 20px !important; }
            .contact-box p:first-child { font-size: 16px !important; }
        }
    </style>
</head>

<body class="bg-white text-gray-900">

    <div id="header"></div>

    <main class="pt-48 pb-32 px-6">

        <div class="max-w-5xl mx-auto">

            <div class="mb-10 reveal">
                <span class="text-sm font-bold tracking-[0.2em] text-gray-700 uppercase block mb-2">
                    CONTACT
                </span>
                <h1 class="text-4xl font-bold tracking-tight text-[#222751]">
                    견적문의
                </h1>
            </div>

            <form id="contactForm" class="bg-[#dbdbdb] p-8 md:p-14 space-y-7 reveal">

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 회사명 <span class="text-red-500 ml-1">*</span>
                    </label>
                    <input type="text" name="company_name" required class="w-full bg-white h-11 px-4 outline-none border-none text-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 이메일
                    </label>
                    <input type="email" name="user_email" class="w-full bg-white h-11 px-4 outline-none border-none text-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 담당자명 <span class="text-red-500 ml-1">*</span>
                    </label>
                    <input type="text" name="manager_name" required class="w-full bg-white h-11 px-4 outline-none border-none text-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 연락처 <span class="text-red-500 ml-1">*</span>
                    </label>
                    <input type="tel" name="user_phone" required placeholder="휴대번호 또는 유선번호" class="w-full bg-white h-11 px-4 outline-none border-none text-sm placeholder-gray-400">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-start md:items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 문의유형
                    </label>
                    <div class="flex flex-wrap items-center gap-x-5 gap-y-2 text-sm font-bold text-gray-800">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="inquiry_type" value="신규 사무실" class="custom-radio"> 신규 사무실
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="inquiry_type" value="신규 상업공간" class="custom-radio"> 신규 상업공간
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="inquiry_type" value="사무실 리모델링" class="custom-radio"> 사무실 리모델링
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="inquiry_type" value="상업공간 리모델링" class="custom-radio"> 상업공간 리모델링
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="inquiry_type" value="기타" class="custom-radio"> 기타
                        </label>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 회사위치
                    </label>
                    <input type="text" name="company_location" placeholder="주소 또는 구/동" class="w-full bg-white h-11 px-4 outline-none border-none text-sm placeholder-gray-400">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 현장위치
                    </label>
                    <input type="text" name="site_location" placeholder="주소 또는 구/동" class="w-full bg-white h-11 px-4 outline-none border-none text-sm placeholder-gray-400">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 현장규모
                    </label>
                    <input type="text" name="site_size" placeholder="가로 x 세로 x 높이 / 평수" class="w-full bg-white h-11 px-4 outline-none border-none text-sm placeholder-gray-400">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 방문희망일
                    </label>
                    <input type="text" name="visit_date" class="w-full bg-white h-11 px-4 outline-none border-none text-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-start gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center pt-1">
                        <span class="mr-1.5">•</span> 추정예산 (단위: 원)
                    </label>
                    <div class="w-full relative pt-8">
                        <div id="budgetTooltip" class="absolute top-0 left-0 -translate-x-1/2 bg-[#333333] text-white text-[11px] px-2 py-0.5 font-mono after:content-[''] after:absolute after:top-full after:left-1/2 after:-translate-x-1/2 after:border-4 after:border-transparent after:border-t-[#333333] whitespace-nowrap">
                            10,000,000
                        </div>
                        <input type="range" id="budgetRange" name="budget_range" min="0" max="100000000" step="100000" value="10000000" class="w-full h-[5px] bg-[#7a7a7a] outline-none appearance-none cursor-pointer">
                        <p class="text-xs text-gray-500 mt-2 tracking-tight">예상하거나 원하는 예산을 대략적으로 알려주시면 최대한 맞춤으로 진행을 해드립니다.</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-center gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 공사희망일~완료일
                    </label>
                    <input type="text" name="construction_period" class="w-full bg-white h-11 px-4 outline-none border-none text-sm">
                </div>


                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-start gap-2 md:gap-4">
                    <label class="text-base font-bold text-gray-800 flex items-center pt-2">
                        <span class="mr-1.5">•</span> 기타사항
                    </label>
                    <textarea name="etc_memo" rows="6" placeholder="상세히 적어주시면 상담에 큰 도움이 됩니다." class="w-full bg-white p-4 text-sm outline-none border-none resize-none placeholder-gray-400 leading-relaxed"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-[160px_1fr] items-start gap-2 md:gap-4 pt-4">
                    <label class="text-base font-bold text-gray-800 flex items-center">
                        <span class="mr-1.5">•</span> 개인정보방침 <span class="text-red-500 ml-1">*</span>
                    </label>
                    <div class="flex items-start gap-3 text-xs md:text-sm text-gray-600 font-medium leading-tight">
                        <input type="checkbox" id="privacy" required class="custom-checkbox mt-0.5">
                        <label for="privacy" class="cursor-pointer select-none">
                            동의합니다. (수집항목: 고객명, 전화번호, 메일 / 이용목적: 견적상담 / 보유기간: 3개월 이내)
                        </label>
                    </div>
                </div>

                <div class="text-center pt-8">
                    <button type="submit" class="bg-[#292552] text-white text-sm font-bold px-10 py-3.5 hover:bg-[#1f1b3e] transition-all tracking-wider">
                        문의하기
                    </button>
                </div>

            </form>

        </div>

    </main>

    <!-- 🟢 우측 하단 연락처 글씨 레이아웃 원본 그대로 100% 유지 -->
    <div class="contact-box fixed bottom-10 right-10 z-[99999] flex flex-col items-end select-none">
        <div id="dynamic-text-target" class="dynamic-contact-text mb-5 flex flex-col items-end text-right">
            <p class="text-[21px] font-black tracking-tighter">010-4192-0882</p>
            <p class="text-sm font-light opacity-90 tracking-[0.055em] mr-[-0.055em]">camp0882@daum.net</p>
        </div>
        <div class="flex justify-end gap-3">
            <a href="javascript:void(0);" onclick="openNaverBlog();" class="w-10 h-10 rounded-full bg-[#03C75A] flex items-center justify-center text-white text-[10px] font-bold uppercase hover:scale-105 shadow-lg transition-transform">
                BLOG
            </a>
            <a href="http://pf.kakao.com/_AJxenX" class="w-10 h-10 rounded-full bg-[#fae100] flex items-center justify-center overflow-hidden hover:scale-105 shadow-lg transition-transform">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/KakaoTalk_logo.svg" alt="카카오톡" class="w-5 h-5 object-contain">
            </a>
        </div>
    </div>

    <div id="footer"></div>

    <script>
        // 1. EmailJS 초기화 설정
        (function() {
            emailjs.init("sz8Xrb2U1XmDIarMr"); 
        })();

        // header/footer 불러오기
        fetch('./components/header.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('header').innerHTML = data;
        });

        fetch('./components/footer.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        });

        window.toggleMenu = function () {
            const menu = document.getElementById("mobileMenu");
            if(menu){
                menu.classList.toggle("hidden");
            }
        };

        // 추정예산 슬라이더 10만원 단위 반영 스크립트
        const rangeInput = document.getElementById('budgetRange');
        const tooltip = document.getElementById('budgetTooltip');

        function updateSlider() {
            const val = parseInt(rangeInput.value);
            const min = parseInt(rangeInput.min);
            const max = parseInt(rangeInput.max);
            
            tooltip.textContent = val.toLocaleString();
            
            const percent = ((val - min) / (max - min)) * 100;
            tooltip.style.left = `calc(${percent}% - (${percent * 0.14}px - 7px))`;
        }

        rangeInput.addEventListener('input', updateSlider);
        window.addEventListener('DOMContentLoaded', updateSlider);


        // 2. 문의하기 폼 Submit (이메일 전송 처리)
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault(); // 기본 폼 제출 동작 차단

            // 슬라이더 포맷팅된 텍스트 값을 전송 데이터에 포함하기 위해 원 단위 가공
            const formattedBudget = parseInt(rangeInput.value).toLocaleString() + "원";

            emailjs.sendForm('service_wsz5497', 'template_a35v7vi', this)
                .then(function() {
                    alert('견적 문의가 정상적으로 전송되었습니다. 확인 후 빠른 시일 내에 연락드리겠습니다.');
                    document.getElementById('contactForm').reset(); // 폼 초기화
                    updateSlider(); // 슬라이더 눈금 리셋
                }, function(error) {
                    alert('메일 전송에 실패했습니다. 다시 시도해 주시거나 대표 번호로 문의 바랍니다. 에러: ' + JSON.stringify(error));
                });
        });

        // ✨ 스크롤 실시간 감지하여 푸터 진입 시 연락처 글자 색상을 반전(파란색 -> 흰색)시키는 함수
        function checkScrollContact() {
            const windowHeight = window.innerHeight;
            const textTarget = document.getElementById('dynamic-text-target');
            const footer = document.getElementById('footer');

            if (textTarget && footer) {
                const footerTop = footer.getBoundingClientRect().top;
                
                if (footerTop < windowHeight - 150) {
                    textTarget.classList.add('footer-bg');
                } else {
                    textTarget.classList.remove('footer-bg');
                }
            }
        }

        // 📱 모바일/PC 식별형 네이버 블로그 링크 포워딩
        function openNaverBlog() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            let blogUrl = "";
            if (isMobile) {
                blogUrl = "https://m.blog.naver.com/zinux_?noTrackingCode=true&proxyReferer=&tab=1";
            } else {
                blogUrl = "https://blog.naver.com/zinux_";
            }
            
            window.open(blogUrl, '_blank');
        }

        // reveal animation
        window.addEventListener('scroll', () => {
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach(el => {
                const windowHeight = window.innerHeight;
                const revealTop = el.getBoundingClientRect().top;

                if (revealTop < windowHeight - 100) {
                    el.classList.add('active');
                }
            });
            
            // 연락처 실시간 제어 호출 함께 연동
            checkScrollContact();
        });

        window.addEventListener('resize', checkScrollContact);
        window.dispatchEvent(new Event('scroll'));
        setTimeout(checkScrollContact, 400);
    </script>

</body>
</html>
