<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE DESIGN | 전체 프로젝트</title>

    <link rel="icon" href="https://i.imgur.com/f1j8a7x.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        body {
            font-family: "Pretendard", sans-serif;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }

        /* TAB */
        .tab-link {
            position: relative;
            padding-bottom: 8px;
            transition: all 0.3s;
        }

        .tab-link.active {
            color: #1e3a8a;
            font-weight: bold;
        }

        .tab-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #1e3a8a;
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .dynamic-contact-text {
            color: #162e59;
            transition: color 0.3s ease;
        }
        .dynamic-contact-text.footer-bg {
            color: #ffffff !important;
        }

        /* Pagination Buttons */
        .page-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
            color: #6b7280;
            transition: all 0.3s;
            cursor: pointer;
        }
        .page-btn:hover {
            background-color: #f3f4f6;
            color: #111827;
        }
        .page-btn.active {
            background-color: #1e3a8a;
            color: white;
        }

        @media (max-width: 768px) {
            .tab-wrap {
                gap: 32px !important;
                font-size: 14px !important;
            }
            .contact-box { right: 20px !important; bottom: 20px !important; }
            .contact-box p:first-child { font-size: 16px !important; }
        }
    </style>
</head>

<body class="bg-white text-gray-900">

    <div id="header"></div>

    <section class="pt-48 pb-10">
        <div class="max-w-[1400px] mx-auto px-6 text-center">
            <h2 class="text-[11px] text-[#1e3a8a] font-bold tracking-[0.4em] uppercase mb-4 reveal">
                Portfolio
            </h2>
            <h3 class="text-4xl md:text-5xl font-black leading-snug reveal">
                프로젝트
            </h3>
        </div>
    </section>

    <section class="mb-20">
        <div class="tab-wrap max-w-[1400px] mx-auto flex justify-center gap-16 py-6 text-[19px] font-bold tracking-wide reveal">
            <a href="project_all.html" class="tab-link active">전체보기</a>
            <a href="office.html" class="tab-link text-gray-400 hover:text-black transition-colors">사무공간</a>
            <a href="commercial.html" class="tab-link text-gray-400 hover:text-black transition-colors">상업공간</a>
        </div>
    </section>

    <section class="pb-32">
        <div class="max-w-[1400px] mx-auto px-6">
            
            <!-- 💡 프로젝트가 그려질 Grid 영역 -->
            <div id="project-container" class="grid grid-cols-1 md:grid-cols-3 gap-x-8 gap-y-16 min-h-[500px]">
                <!-- 자바스크립트가 여기에 HTML을 꽂아 넣습니다 -->
            </div>

            <!-- 💡 페이지네이션 버튼 영역 -->
            <div id="pagination-container" class="flex justify-center gap-2 mt-20">
                <!-- 버튼들이 생성됩니다 -->
            </div>

        </div>
    </section>

    <!-- 고정 연락처 -->
    <div class="contact-box fixed bottom-10 right-10 z-[99999] flex flex-col items-end select-none">
        <div id="dynamic-text-target" class="dynamic-contact-text mb-5 flex flex-col items-end text-right">
            <p class="text-[21px] font-black tracking-tighter">010-4192-0882</p>
            <p class="text-sm font-light opacity-90 tracking-[0.055em] mr-[-0.055em]">camp0882@daum.net</p>
        </div>
        <div class="flex justify-end gap-3">
            <a href="javascript:void(0);" onclick="openNaverBlog();" class="w-10 h-10 rounded-full bg-[#03C75A] flex items-center justify-center text-white text-[10px] font-bold uppercase hover:scale-105 shadow-lg transition-transform">BLOG</a>
            <a href="http://pf.kakao.com/_AJxenX" class="w-10 h-10 rounded-full bg-[#fae100] flex items-center justify-center overflow-hidden hover:scale-105 shadow-lg transition-transform">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/KakaoTalk_logo.svg" alt="카카오톡" class="w-5 h-5 object-contain">
            </a>
        </div>
    </div>

    <div id="footer"></div>

    <script>
        // ==========================================
        // 1. 프로젝트 전체 데이터 리스트 (상업공간 신규 링크 및 리스트 최종 리팩토링)
        // ==========================================
        const allProjects = [
            {
                title: "[오산] 사무실 인테리어",
                tag: "사무공간 / 유리파티션 & 인테리어 공사",
                img: "https://imgur.com/2Ed0O16.jpg",
                link: "project_detail_04.html"
            },
            {
                title: "[오산] 전시장",
                tag: "전시공간 / 인테리어 공사",
                img: "https://imgur.com/ok0AjCp.jpg",
                link: "project_detail_02.html"
            },
            {
                title: "[오산] 복층 사무실 인테리어",
                tag: "사무공간 / 복층 & 인테리어 공사",
                img: "https://imgur.com/hkhTopY.jpg",
                link: "project_detail_03.html"
            },
            {
                title: "[평택] 노무법인사무실",
                tag: "사무공간 / 유리파티션 공사",
                img: "https://imgur.com/HBTjbpu.jpg",
                link: "project_detail_01.html"
            },
            {
                title: "[수원] 방산업체 사무실 인테리어",
                tag: "사무공간 / 철거 & 인테리어 공사",
                img: "https://imgur.com/X1didZX.jpg",
                link: "project_detail_05.html"
            },
            {
                title: "[수원] 공장 사무실 인테리어",
                tag: "사무공간 / 복층 & 인테리어 공사",
                img: "https://imgur.com/8HPzxLm.jpg",
                link: "project_detail_06.html"
            },
            {
                title: "[평택] 환경 실험실 인테리어",
                tag: "사무공간 / 벽체 & 파사드",
                img: "https://imgur.com/nUXdzXG.jpg",
                link: "project_detail_07.html"
            },
            {
                title: "[오산] 직원 휴게실 인테리어",
                tag: "휴게공간 / 장판 & 인테리어 공사",
                img: "https://imgur.com/RJmCnI2.jpg",
                link: "project_detail_08.html"
            },
            {
                title: "[동탄] 메테리얼즈 사무실 인테리어",
                tag: "사무공간 / 이미지월 & 파사드",
                img: "https://imgur.com/jgkQq1p.jpg",
                link: "project_detail_09.html"
            },
            // --- 💡 10번째 인덱스에 상업공간 정식 분리 파일명 commercial_detail_01.html을 매칭했습니다! ---
            {
                title: "[수원] 아구찜 음식점 인테리어",
                tag: "상업공간 / 철거 & 인테리어 공사",
                img: "https://imgur.com/2MwxLjF.jpg",
                link: "commercial_detail_01.html"
            }
        ];

        // ==========================================
        // 2. 페이지네이션 핵심 로직 세팅
        // ==========================================
        const itemsPerPage = 9; // 한 페이지에 보여줄 개수
        let currentPage = 1;    // 현재 페이지 번호

        // 리스트를 화면에 그리는 함수
        function renderProjects(page) {
            const container = document.getElementById('project-container');
            container.innerHTML = ""; // 기존 내용 비우기

            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentItems = allProjects.slice(startIndex, endIndex);

            currentItems.forEach(item => {
                const html = `
                    <div class="group cursor-pointer reveal">
                        <div class="relative overflow-hidden aspect-video bg-gray-100 mb-6 rounded-lg shadow-sm">
                            <img src="${item.img}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" alt="${item.title}">
                            <a href="${item.link}" class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition duration-500 flex items-center justify-center z-10">
                                <span class="text-white text-sm tracking-[0.3em] uppercase font-bold">View Project</span>
                            </a>
                        </div>
                        <h4 class="text-xl font-bold tracking-tight group-hover:text-[#1e3a8a] transition-colors mb-1.5">
                            ${item.title}
                        </h4>
                        <p class="text-[13px] text-[#1e3a8a] font-bold tracking-widest uppercase">
                            ${item.tag}
                        </p>
                    </div>
                `;
                container.innerHTML += html;
            });

            // 화면을 새로 그렸으니 애니메이션 다시 트리거
            setTimeout(reveal, 100); 
        }

        // 하단 번호 버튼을 그리는 함수
        function renderPagination() {
            const totalPages = Math.ceil(allProjects.length / itemsPerPage);
            const paginationContainer = document.getElementById('pagination-container');
            paginationContainer.innerHTML = "";

            // 페이지가 1개 이하면 버튼을 만들지 않음
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('div');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                
                btn.addEventListener('click', () => {
                    currentPage = i;
                    renderProjects(currentPage);
                    renderPagination(); // 번호 색상 업데이트
                    window.scrollTo({ top: 300, behavior: 'smooth' }); 
                });

                paginationContainer.appendChild(btn);
            }
        }

        // 초기화
        renderProjects(currentPage);
        renderPagination();

        // 컴포넌트 로드
        fetch('./components/header.html')
            .then(res => res.text())
            .then(data => { document.getElementById('header').innerHTML = data; });

        fetch('./components/footer.html')
            .then(res => res.text())
            .then(data => { document.getElementById('footer').innerHTML = data; });

        window.toggleMenu = function () {
            const menu = document.getElementById("mobileMenu");
            if (menu) menu.classList.toggle("hidden");
        };

        function checkScrollContact() {
            const windowHeight = window.innerHeight;
            const textTarget = document.getElementById('dynamic-text-target');
            const footer = document.getElementById('footer');

            if (textTarget && footer) {
                const footerTop = footer.getBoundingClientRect().top;
                if (footerTop < windowHeight - 150) {
                    textTarget.classList.add('footer-bg');
                } else {
                    textTarget.classList.remove('footer-bg');
                }
            }
        }

        function openNaverBlog() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            let blogUrl = isMobile ? "https://m.blog.naver.com/zinux_?noTrackingCode=true&proxyReferer=&tab=1" : "https://blog.naver.com/zinux_";
            window.open(blogUrl, '_blank');
        }

        function reveal() {
            const reveals = document.querySelectorAll(".reveal");
            for (let i = 0; i < reveals.length; i++) {
                const windowHeight = window.innerHeight;
                const elementTop = reveals[i].getBoundingClientRect().top;
                if (elementTop < windowHeight - 50) {
                    reveals[i].classList.add("active");
                }
            }
            checkScrollContact();
        }

        window.addEventListener("scroll", reveal);
        window.addEventListener('resize', checkScrollContact);
        setTimeout(checkScrollContact, 400);

    </script>
</body>

</html>
