<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE DESIGN | 전체 프로젝트</title>

    <link rel="icon" href="https://i.imgur.com/P5pty6X.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        body {
            font-family: "Pretendard", sans-serif;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }

        /* TAB */
        .tab-link {
            position: relative;
            padding-bottom: 8px;
            transition: all 0.3s;
        }

        .tab-link.active {
            color: #1e3a8a;
            font-weight: bold;
        }

        .tab-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #1e3a8a;
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .dynamic-contact-text {
            color: #162e59;
            transition: color 0.3s ease;
        }
        .dynamic-contact-text.footer-bg {
            color: #ffffff !important;
        }

        /* Pagination Buttons */
        .page-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
            color: #6b7280;
            transition: all 0.3s;
            cursor: pointer;
        }
        .page-btn:hover {
            background-color: #f3f4f6;
            color: #111827;
        }
        .page-btn.active {
            background-color: #1e3a8a;
            color: white;
        }

        @media (max-width: 768px) {
            .tab-wrap {
                gap: 32px !important;
                font-size: 14px !important;
            }
            .contact-box { right: 20px !important; bottom: 20px !important; }
            .contact-box p:first-child { font-size: 16px !important; }
        }
    </style>
</head>

<body class="bg-white text-gray-900">

    <div id="header"></div>

    <section class="pt-48 pb-10">
        <div class="max-w-[1400px] mx-auto px-6 text-center">
            <h2 class="text-[11px] text-[#1e3a8a] font-bold tracking-[0.4em] uppercase mb-4 reveal">
                Portfolio
            </h2>
            <h3 class="text-4xl md:text-5xl font-black leading-snug reveal">
                프로젝트
            </h3>
        </div>
    </section>

    <section class="mb-20">
        <div class="tab-wrap max-w-[1400px] mx-auto flex justify-center gap-16 py-6 text-[19px] font-bold tracking-wide reveal">
            <a href="project_all.html" class="tab-link active">전체보기</a>
            <a href="office.html" class="tab-link text-gray-400 hover:text-black transition-colors">사무공간</a>
            <a href="commercial.html" class="tab-link text-gray-400 hover:text-black transition-colors">상업공간</a>
        </div>
    </section>

    <section class="pb-32">
        <div class="max-w-[1400px] mx-auto px-6">
            
            <div id="project-container" class="grid grid-cols-1 md:grid-cols-3 gap-x-8 gap-y-16 min-h-[500px]">
                </div>

            <div id="pagination-container" class="flex justify-center gap-2 mt-20">
                </div>

        </div>
    </section>

    <div class="contact-box fixed bottom-10 right-10 z-[99999] flex flex-col items-end select-none">
        <div id="dynamic-text-target" class="dynamic-contact-text mb-5 flex flex-col items-end text-right">
            <p class="text-[21px] font-black tracking-tighter">010-4192-0882</p>
            <p class="text-sm font-light opacity-90 tracking-[0.055em] mr-[-0.055em]">camp0882@daum.net</p>
        </div>
        <div class="flex justify-end gap-3">
            <a href="javascript:void(0);" onclick="openNaverBlog();" class="w-10 h-10 rounded-full bg-[#03C75A] flex items-center justify-center text-white text-[10px] font-bold uppercase hover:scale-105 shadow-lg transition-transform">
                BLOG
            </a>
            
            <a href="http://pf.kakao.com/_AJxenX" target="_blank" rel="noopener noreferrer" class="w-10 h-10 rounded-full bg-[#fae100] flex items-center justify-center overflow-hidden hover:scale-105 shadow-lg transition-transform">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/KakaoTalk_logo.svg" alt="카카오톡" class="w-5 h-5 object-contain">
            </a>

            <a href="javascript:void(0);" onclick="copyEmail();" class="w-10 h-10 rounded-full bg-white border border-gray-100 flex items-center justify-center text-[#1e3a8a] hover:scale-105 shadow-lg transition-transform" title="이메일 주소 복사">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
            </a>
        </div>
    </div>

    <div id="footer"></div>

    <script>
        // ==========================================
        // 1. 프로젝트 전체 데이터 리스트
        // ==========================================
        const allProjects = [
            {
                title: "[동탄] 지식산업센터 K-Materials 사무실",
                tag: "사무공간 / 이미지월 & 파사드",
                img: "https://i.imgur.com/jgkQq1p.jpg",
                link: "project_detail_09.html"
            },
            {
                title: "[오산] SENKO 전시장",
                tag: "전시공간 / 전시공간 인테리어",
                img: "https://i.imgur.com/ok0AjCp.jpg",
                link: "project_detail_02.html"
            },
            {
                title: "[오산] 지식산업센터 (주)현진산업 복층 사무실",
                tag: "사무공간 / 복층 & 유리파티션 & 이미지월 & 파사드",
                img: "https://i.imgur.com/hkhTopY.jpg",
                link: "project_detail_03.html"
            },
            {
                title: "[오산] 지식산업센터 PetaX 사무실",
                tag: "사무공간 / 유리파티션 & 파사드",
                img: "https://i.imgur.com/2Ed0O16.jpg",
                link: "project_detail_04.html"
            },
            {
                title: "[동탄] (주)삼정오토메이션 사무실",
                tag: "사무공간 / 철거 & 리모델링",
                img: "https://i.imgur.com/X1didZX.jpg",
                link: "project_detail_05.html"
            },
            {
                title: "[수원] (주)파워에스티 공장 & 사무실",
                tag: "사무공간 / 복층 & 유리파티션 & 파사드 & 작업공간",
                img: "https://i.imgur.com/8HPzxLm.jpg",
                link: "project_detail_06.html"
            },
            {
                title: "[오산] 지식산업센터 (주)환경티에스 실험실",
                tag: "사무공간 / 실험실 & 파사드",
                img: "https://i.imgur.com/nUXdzXG.jpg",
                link: "project_detail_07.html"
            },
            {
                title: "[수원] 아구찜 음식점",
                tag: "상업공간 / 철거 & 인테리어",
                img: "https://i.imgur.com/2MwxLjF.jpg",
                link: "commercial_detail_01.html"
            },
            {
                title: "[화성] 힐링숲 힐링카페",
                tag: "상업공간 / 인테리어",
                img: "https://i.imgur.com/dZI0Dmw.jpg",
                link: "commercial_detail_02.html"
            },
            {
                title: "[오산] 직원 휴게실 인테리어",
                tag: "휴게공간 / 장판 & 인테리어",
                img: "https://i.imgur.com/RJmCnI2.jpg",
                link: "project_detail_08.html"
            },
            {
                title: "[평택] 노무법인세명 사무실",
                tag: "사무공간 / 유리파티션",
                img: "https://i.imgur.com/HBTjbpu.jpg",
                link: "project_detail_01.html"
            },
            // ✅ 새로 추가된 이자카야 음식점 데이터
            {
                title: "[평택] 이자카야 음식점",
                tag: "상업공간 / 인테리어",
                img: "https://i.imgur.com/81v09Gn.jpg", // 임시로 지정된 썸네일 이미지입니다.
                link: "commercial_detail_03.html"
            }
        ];

        // ==========================================
        // 2. 페이지네이션 핵심 로직 세팅
        // ==========================================
        const itemsPerPage = 9;
        let currentPage = 1;

        function renderProjects(page) {
            const container = document.getElementById('project-container');
            container.innerHTML = "";

            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentItems = allProjects.slice(startIndex, endIndex);

            currentItems.forEach(item => {
                const html = `
                    <div class="group cursor-pointer reveal">
                        <div class="relative overflow-hidden aspect-video bg-gray-100 mb-6 rounded-lg shadow-sm">
                            <img src="${item.img}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" alt="${item.title}">
                            <a href="${item.link}" class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition duration-500 flex items-center justify-center z-10">
                                <span class="text-white text-sm tracking-[0.3em] uppercase font-bold">View Project</span>
                            </a>
                        </div>
                        <h4 class="text-xl font-bold tracking-tight group-hover:text-[#1e3a8a] transition-colors mb-1.5">
                            ${item.title}
                        </h4>
                        <p class="text-[13px] text-[#1e3a8a] font-bold tracking-widest uppercase">
                            ${item.tag}
                        </p>
                    </div>
                `;
                container.innerHTML += html;
            });

            setTimeout(reveal, 100); 
        }

        function renderPagination() {
            const totalPages = Math.ceil(allProjects.length / itemsPerPage);
            const paginationContainer = document.getElementById('pagination-container');
            paginationContainer.innerHTML = "";

            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('div');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                
                btn.addEventListener('click', () => {
                    currentPage = i;
                    renderProjects(currentPage);
                    renderPagination();
                    window.scrollTo({ top: 300, behavior: 'smooth' }); 
                });

                paginationContainer.appendChild(btn);
            }
        }

        // 초기화
        renderProjects(currentPage);
        renderPagination();

        // 컴포넌트 로드
        fetch('./components/header.html')
            .then(res => res.text())
            .then(data => { document.getElementById('header').innerHTML = data; });

        fetch('./components/footer.html')
            .then(res => res.text())
            .then(data => { document.getElementById('footer').innerHTML = data; });

        window.toggleComponentMenu = function () {
            const menu = document.getElementById("componentMobileMenu");
            if(menu) {
                menu.classList.toggle("hidden");
            }
        };

        function checkScrollContact() {
            const windowHeight = window.innerHeight;
            const textTarget = document.getElementById('dynamic-text-target');
            const footer = document.getElementById('footer');

            if (textTarget && footer) {
                const footerTop = footer.getBoundingClientRect().top;
                if (footerTop < windowHeight - 150) {
                    textTarget.classList.add('footer-bg');
                } else {
                    textTarget.classList.remove('footer-bg');
                }
            }
        }

        function openNaverBlog() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            let blogUrl = isMobile ? "https://m.blog.naver.com/zinux_?noTrackingCode=true&proxyReferer=&tab=1" : "https://blog.naver.com/zinux_";
            window.open(blogUrl, '_blank');
        }

        // 이메일 복사 함수
        window.copyEmail = function() {
            const email = "camp0882@daum.net";
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(email).then(() => {
                    alert("이메일 주소(" + email + ")가 복사되었습니다.");
                }).catch(() => fallbackCopyTextToClipboard(email));
            } else {
                fallbackCopyTextToClipboard(email);
            }
        };

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "absolute";
            textArea.style.left = "-999999px"; 
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    alert("이메일 주소(" + text + ")가 복사되었습니다.");
                } else {
                    alert("복사 실패. 이메일 주소를 직접 복사해주세요: " + text);
                }
            } catch (err) {
                alert("이 환경에서는 복사가 지원되지 않습니다: " + text);
            }
            
            document.body.removeChild(textArea);
        }

        function reveal() {
            const reveals = document.querySelectorAll(".reveal");
            for (let i = 0; i < reveals.length; i++) {
                const windowHeight = window.innerHeight;
                const elementTop = reveals[i].getBoundingClientRect().top;
                if (elementTop < windowHeight - 50) {
                    reveals[i].classList.add("active");
                }
            }
            checkScrollContact();
        }

        window.addEventListener("scroll", reveal);
        window.addEventListener('resize', checkScrollContact);
        setTimeout(checkScrollContact, 400);

    </script>
</body>

</html>
