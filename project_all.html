<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE DESIGN | 전체 프로젝트</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        body {
            font-family: "Pretendard", sans-serif;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body class="bg-white text-gray-900">

    <section class="mb-20">

                <div class="group cursor-pointer reveal">

                        <img src="https://imgur.com/HBTjbpu.jpg"
                            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                        
                        <a href="project_detail_01.html"
                            class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition duration-500 flex items-center justify-center z-10">
                            <span class="text-white text-sm tracking-[0.3em] uppercase font-bold">
                                View Project
                            </span>
                        </a>
                    </div>
                    <p class="text-[10px] text-[#1e3a8a] font-bold tracking-widest uppercase mb-2">
                        Office
                    </p>
                    <h4 class="text-xl font-bold tracking-tight group-hover:text-[#1e3a8a] transition-colors">
                        노무법인세명 사무실
                    </h4>
                </div>

                <div class="group cursor-pointer reveal">
                    <div class="relative overflow-hidden aspect-[4/5] bg-gray-100 mb-6 rounded-sm">
                        <img src="https://imgur.com/c998gUY.jpg"
                            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                        
                        <a href="project_detail_02.html" 
                            class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition duration-500 flex items-center justify-center z-10">
                            <span class="text-white text-sm tracking-[0.3em] uppercase font-bold">
                                View Project
                            </span>
                        </a>
                    </div>
                    <p class="text-[10px] text-[#1e3a8a] font-bold tracking-widest uppercase mb-2">
                        Commercial
                    </p>
                    <h4 class="text-xl font-bold tracking-tight group-hover:text-[#1e3a8a] transition-colors">
                        2026-JOIL
                    </h4>
                </div>

                <div class="group cursor-pointer reveal">
                    <div class="relative overflow-hidden aspect-[4/5] bg-gray-100 mb-6 rounded-sm">
                        <img src="https://imgur.com/mGCrfNi.jpg" 
                            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                        
                        <a href="project_detail_03.html"
                            class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition duration-500 flex items-center justify-center z-10">
                            <span class="text-white text-sm tracking-[0.3em] uppercase font-bold">
                                View Project
                            </span>
                        </a>
                    </div>
                    <p class="text-[10px] text-[#1e3a8a] font-bold tracking-widest uppercase mb-2">
                        Office
                    </p>
                    <h4 class="text-xl font-bold tracking-tight group-hover:text-[#1e3a8a] transition-colors">
                        Materials
                    </h4>
                </div>

                <div class="group cursor-pointer reveal">
                    <div class="relative overflow-hidden aspect-[4/5] bg-gray-100 mb-6 rounded-sm">
                        <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000"

                        로앤HR컨설팅
                    </h4>
                </div>

            </div>
        </div>
    </section>

    <div id="footer"></div>

    <script>
        // header
        fetch('./components/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
            });

        // footer
        fetch('./components/footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });

        window.toggleMenu = function () {
            const menu = document.getElementById("mobileMenu");
            if (menu) {
                menu.classList.toggle("hidden");
            }
        };

        // reveal animation
        function reveal() {
            const reveals = document.querySelectorAll(".reveal");
            for (let i = 0; i < reveals.length; i++) {
                const windowHeight = window.innerHeight;
                const elementTop = reveals[i].getBoundingClientRect().top;
                if (elementTop < windowHeight - 100) {
                    reveals[i].classList.add("active");
                }
            }
        }

        window.addEventListener("scroll", reveal);
        reveal();
    </script>
</body>

</html>
