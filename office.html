<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE DESIGN | 사무공간</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        body {
            font-family: "Pretendard", sans-serif;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }

        /* TAB */
        .tab-link {
            position: relative;
            padding-bottom: 8px;
            transition: all 0.3s;
        }

        .tab-link.active {
            color: #1e3a8a;
            font-weight: bold;
        }

        .tab-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #1e3a8a;
        }

        /* PROJECT */
        .project-card:hover img {
            transform: scale(1.05);
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 32px !important;
            }

            .hero-sub {
                font-size: 13px !important;
                padding: 0 20px;
                line-height: 1.6;
            }

            .tab-wrap {
                gap: 24px !important;
                font-size: 12px !important;
            }

            .project-grid {
                grid-template-columns: 1fr !important;
                gap-y: 50px !important;
            }
        }
    </style>
</head>

<body class="bg-white text-gray-900">

    <!-- HEADER -->
    <div id="header"></div>

    <!-- MOBILE MENU -->
    <div id="mobileMenu"
        class="hidden fixed top-[70px] left-0 w-full bg-white z-40 border-b border-gray-100 px-6 py-8 md:hidden">
        <div class="flex flex-col gap-6 text-[15px] font-bold text-gray-800 uppercase">
            <a href="about.html">회사소개</a>
            <a href="project_all.html">프로젝트</a>
            <a href="contact.html">견적문의</a>
            <a href="notice.html">공지사항</a>
        </div>
    </div>

    <!-- HERO -->
    <section class="relative h-[450px] flex items-center justify-center text-white overflow-hidden">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=2000"
                class="w-full h-full object-cover brightness-[0.4]">
        </div>
        <div class="relative z-10 text-center">
            <h1 class="hero-title text-4xl md:text-5xl font-bold tracking-tight mb-4 uppercase">
                사무공간
            </h1>
            <p class="hero-sub text-sm md:text-base font-light tracking-widest text-gray-300">
                좋은 자재와 꼼꼼한 시공으로 믿음을 드립니다.
            </p>
        </div>
    </section>

    <!-- TAB -->
    <div class="border-b border-gray-100 mb-16">
        <div class="tab-wrap max-w-[1400px] mx-auto flex justify-center gap-12 py-6 text-[14px] font-medium text-gray-400">
            <a href="project_all.html" class="tab-link">
                전체보기
            </a>
            <a href="office.html" class="tab-link active">
                사무공간
            </a>
            <a href="commercial.html" class="tab-link">
                상업공간
            </a>
        </div>
    </div>

    <!-- PROJECT -->
    <main class="max-w-[1400px] mx-auto px-6 pb-40">
        <div class="project-grid grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-20">

            <!-- 🏢 ITEM 1: 노무법인세명 사무실 (전체보기의 1번 아이템) -->
            <a href="project_detail_01.html" class="project-card group block">
                <div class="overflow-hidden bg-gray-100 aspect-video mb-6">
                    <img src="https://imgur.com/HBTjbpu.jpg"
                        class="w-full h-full object-cover transition-transform duration-500"
                        alt="노무법인세명 사무실">
                </div>
                <div>
                    <p class="text-[11px] text-gray-400 mb-2 uppercase tracking-wider">
                        오산 / 사무공간
                    </p>
                    <h3 class="text-lg font-bold tracking-tight group-hover:text-[#1e3a8a] transition-colors">
                        노무법인세명 사무실
                    </h3>
                </div>
            </a>

            <!-- 🏢 ITEM 2: Materials (전체보기의 3번 아이템) -->
            <a href="project_detail_03.html" class="project-card group block">
                <div class="overflow-hidden bg-gray-100 aspect-video mb-6">
                    <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?q=80&w=1200"
                        class="w-full h-full object-cover transition-transform duration-500"
                        alt="Materials">
                </div>
                <div>
                    <p class="text-[11px] text-gray-400 mb-2 uppercase tracking-wider">
                        광교 / 사무공간
                    </p>
                    <h3 class="text-lg font-bold tracking-tight group-hover:text-[#1e3a8a] transition-colors">
                        Materials 광교 테크노밸리 공유 오피스
                    </h3>
                </div>
            </a>

            <!-- COMING -->
            <div class="group block border-t border-gray-100 pt-10">
                <div class="bg-gray-50 aspect-video mb-6 flex items-center justify-center text-gray-200 uppercase tracking-tighter text-4xl font-bold">
                    Coming Soon
                </div>
                <p class="text-[11px] text-gray-300 mb-2 uppercase">
                    OO / 사무공간
                </p>
                <h3 class="text-lg font-bold text-gray-300">
                    OOOO
                </h3>
            </div>

            <!-- COMING -->
            <div class="group block border-t border-gray-100 pt-10">
                <div class="bg-gray-50 aspect-video mb-6 flex items-center justify-center text-gray-200 uppercase tracking-tighter text-4xl font-bold">
                    Coming Soon
                </div>
                <p class="text-[11px] text-gray-300 mb-2 uppercase">
                    OO / 사무공간
                </p>
                <h3 class="text-lg font-bold text-gray-300">
                    OOOO
                </h3>
            </div>

        </div>

        <!-- PAGE -->
        <div class="mt-20 flex justify-center gap-2">
            <span class="w-8 h-8 flex items-center justify-center bg-[#1e3a8a] text-white text-xs">
                1
            </span>
            <span class="w-8 h-8 flex items-center justify-center border border-gray-200 text-gray-400 text-xs cursor-pointer hover:bg-gray-50">
                2
            </span>
            <span class="w-8 h-8 flex items-center justify-center border border-gray-200 text-gray-400 text-xs cursor-pointer hover:bg-gray-50">
                3
            </span>
            <span class="w-8 h-8 flex items-center justify-center border border-gray-200 text-gray-400 text-xs cursor-pointer hover:bg-gray-50">
                4
            </span>
        </div>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script>
        // HEADER
        fetch('./components/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
            });

        // FOOTER
        fetch('./components/footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });

        window.toggleMenu = function () {
            const menu = document.getElementById("mobileMenu");
            if (menu) {
                menu.classList.toggle("hidden");
            }
        };
    </script>
</body>

</html>
