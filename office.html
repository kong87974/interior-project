<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE DESIGN | 사무공간</title>

    <link rel="icon" href="https://i.imgur.com/f1j8a7x.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        body {
            font-family: "Pretendard", sans-serif;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }

        /* TAB */
        .tab-link {
            position: relative;
            padding-bottom: 8px;
            transition: all 0.3s;
        }

        .tab-link.active {
            color: #1e3a8a;
            font-weight: bold;
        }

        .tab-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #1e3a8a;
        }

        /* PROJECT ANIMATION */
        .project-card:hover img {
            transform: scale(1.05);
        }

        /* 슬라이딩 업 애니메이션 */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 우측 하단 연락처 글자 색상 실시간 제어 스타일 */
        .dynamic-contact-text {
            color: #162e59;
            transition: color 0.3s ease;
        }
        .dynamic-contact-text.footer-bg {
            color: #ffffff !important;
        }

        /* Pagination Buttons */
        .page-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
            color: #6b7280;
            transition: all 0.3s;
            cursor: pointer;
        }
        .page-btn:hover {
            background-color: #f3f4f6;
            color: #111827;
        }
        .page-btn.active {
            background-color: #1e3a8a;
            color: white;
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 38px !important;
            }

            .hero-desc {
                font-size: 14px !important;
                line-height: 1.8;
            }

            .project-grid {
                grid-template-columns: 1fr !important;
                gap-y: 40px !important; /* 모바일에서도 줄간격 축소 */
            }
            
            .contact-box { right: 20px !important; bottom: 20px !important; }
            .contact-box p:first-child { font-size: 16px !important; }
        }
    </style>
</head>

<body class="bg-white text-gray-900">

    <nav id="header"></nav>

    <div id="mobileMenu"
        class="hidden fixed top-[70px] left-0 w-full bg-white z-40 border-b border-gray-100 px-6 py-8 md:hidden">
        <div class="flex flex-col gap-6 text-[15px] font-bold text-gray-800 uppercase">
            <a href="about.html">회사소개</a>
            <a href="project_all.html">프로젝트</a>
            <a href="contact.html">견적문의</a>
            <a href="notice.html">공지사항</a>
        </div>
    </div>

    <section class="relative h-[400px] w-full flex items-center justify-center text-white overflow-hidden bg-black">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=2000"
                class="w-full h-full object-cover brightness-[0.4]">
        </div>
        <div class="relative z-10 text-center px-6">
            <h1 class="hero-title text-4xl md:text-5xl font-bold tracking-tight mb-6 reveal">
                사무공간
            </h1>
            <p class="hero-desc max-w-2xl mx-auto text-sm md:text-base text-gray-200 leading-relaxed reveal"
                style="transition-delay: 0.1s;">
                업무 효율성과 기업 문화의 가치를 고려한<br>크리에이티브한 사무 공간 디자인을 제안합니다.
            </p>
        </div>
    </section>

    <div class="border-b border-gray-100 mb-16">
        <div class="tab-wrap max-w-[1400px] mx-auto flex justify-center gap-12 py-6 text-[14px] font-medium text-gray-400">
            <a href="project_all.html" class="tab-link">전체보기</a>
            <a href="office.html" class="tab-link active">사무공간</a>
            <a href="commercial.html" class="tab-link">상업공간</a>
        </div>
    </div>

    <main class="max-w-[1400px] mx-auto px-6 pb-32">
        <div id="officeProjectGrid" class="project-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-10 min-h-[500px]">
            </div>

        <div id="pagination-container" class="flex justify-center gap-2 mt-20">
            </div>
    </main>

    <div class="contact-box fixed bottom-10 right-10 z-[99999] flex flex-col items-end select-none">
        <div id="dynamic-text-target" class="dynamic-contact-text mb-5 flex flex-col items-end text-right">
            <p class="text-[21px] font-black tracking-tighter">010-4192-0882</p>
            <p class="text-sm font-light opacity-90 tracking-[0.055em] mr-[-0.055em]">camp0882@daum.net</p>
        </div>
        <div class="flex justify-end gap-3">
            <a href="javascript:void(0);" onclick="openNaverBlog();" class="w-10 h-10 rounded-full bg-[#03C75A] flex items-center justify-center text-white text-[10px] font-bold uppercase hover:scale-105 shadow-lg transition-transform">
                BLOG
            </a>
            <a href="http://pf.kakao.com/_AJxenX" class="w-10 h-10 rounded-full bg-[#fae100] flex items-center justify-center overflow-hidden hover:scale-105 shadow-lg transition-transform">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/KakaoTalk_logo.svg" alt="카카오톡" class="w-5 h-5 object-contain">
            </a>
        </div>
    </div>

    <div id="footer"></div>

    <script>
        // ==========================================
        // 1. 사무공간 프로젝트 데이터 리스트 (추가 4개 포함, 총 9개 세팅)
        // ==========================================
        const officeProjects = [
            {
                title: "[오산] 사무실 인테리어",
                tag: "사무공간 / 유리파티션 및 인테리어 공사",
                img: "https://imgur.com/2Ed0O16.jpg",
                link: "project_detail_04.html"
            },
            {
                title: "[오산] 전시장",
                tag: "전시공간 / 인테리어 공사",
                img: "https://imgur.com/ok0AjCp.jpg",
                link: "project_detail_02.html"
            },
            {
                title: "[오산] 복층 사무실 인테리어",
                tag: "사무공간 / 복층 및 인테리어 공사",
                img: "https://imgur.com/hkhTopY.jpg",
                link: "project_detail_03.html"
            },
            {
                title: "[평택] 노무법인사무실",
                tag: "사무공간 / 유리파티션 공사",
                img: "https://imgur.com/HBTjbpu.jpg",
                link: "project_detail_01.html"
            },
            {
                title: "[수원] 방산업체 사무실 인테리어",
                tag: "사무공간 / 철거 & 인테리어 공사",
                img: "https://imgur.com/X1didZX.jpg",
                link: "project_detail_05.html"
            },
            // --- 💡 아래부터 새로 추가할 4개의 프로젝트 자리입니다 ---
            {
                title: "[새 프로젝트 1 제목]",
                tag: "사무공간 / 공사 내용",
                img: "https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=800",
                link: "project_detail_06.html"
            },
            {
                title: "[새 프로젝트 2 제목]",
                tag: "사무공간 / 공사 내용",
                img: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?q=80&w=800",
                link: "project_detail_07.html"
            },
            {
                title: "[새 프로젝트 3 제목]",
                tag: "사무공간 / 공사 내용",
                img: "https://images.unsplash.com/photo-1497366754035-f200968a6e72?q=80&w=800",
                link: "project_detail_08.html"
            },
            {
                title: "[새 프로젝트 4 제목]",
                tag: "사무공간 / 공사 내용",
                img: "https://images.unsplash.com/photo-1497366811353-6870744d04b2?q=80&w=800",
                link: "project_detail_09.html"
            }
        ];

        // ==========================================
        // 2. 페이지네이션 핵심 로직 세팅
        // ==========================================
        const itemsPerPage = 9; // 한 페이지에 보여줄 개수
        let currentPage = 1;    // 현재 페이지 번호

        // 리스트를 화면에 그리는 함수
        function renderOfficeProjects(page) {
            const container = document.getElementById('officeProjectGrid');
            if(!container) return;
            
            container.innerHTML = ""; // 기존 내용 비우기

            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentItems = officeProjects.slice(startIndex, endIndex);

            currentItems.forEach(project => {
                const html = `
                    <a href="${project.link}" class="project-card group block reveal">
                        <div class="overflow-hidden bg-gray-100 aspect-video mb-6 rounded-lg shadow-sm">
                            <img src="${project.img}"
                                class="w-full h-full object-cover transition-transform duration-500 ease-out"
                                alt="${project.title}">
                        </div>
                        <div>
                            <h3 class="text-xl font-bold tracking-tight group-hover:text-[#1e3a8a] transition-colors mb-1.5">
                                ${project.title}
                            </h3>
                            <p class="text-[13px] text-[#1e3a8a] font-bold tracking-widest uppercase">
                                ${project.tag}
                            </p>
                        </div>
                    </a>
                `;
                container.innerHTML += html;
            });

            // 화면을 새로 그렸으니 애니메이션 다시 트리거
            setTimeout(reveal, 100);
        }

        // 하단 번호 버튼을 그리는 함수
        function renderPagination() {
            const totalPages = Math.ceil(officeProjects.length / itemsPerPage);
            const paginationContainer = document.getElementById('pagination-container');
            if(!paginationContainer) return;
            
            paginationContainer.innerHTML = "";

            // 페이지가 1개 이하면 버튼을 만들지 않음
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('div');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                
                btn.addEventListener('click', () => {
                    currentPage = i;
                    renderOfficeProjects(currentPage);
                    renderPagination(); // 번호 색상 업데이트
                    // 페이지 넘기면 살짝 위로 스크롤 올려주기 (탭 메뉴 위치쯤으로)
                    window.scrollTo({ top: 400, behavior: 'smooth' }); 
                });

                paginationContainer.appendChild(btn);
            }
        }

        // ==========================================
        // 3. 페이지 로드 시 실행 (초기화)
        // ==========================================
        renderOfficeProjects(currentPage);
        renderPagination();

        // ==========================================
        // 기존 컴포넌트 및 UI 함수들
        // ==========================================
        fetch('./components/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
            });

        fetch('./components/footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });

        window.toggleMenu = function () {
            const menu = document.getElementById("mobileMenu");
            if (menu) {
                menu.classList.toggle("hidden");
            }
        };

        function checkScrollContact() {
            const windowHeight = window.innerHeight;
            const textTarget = document.getElementById('dynamic-text-target');
            const footer = document.getElementById('footer');

            if (textTarget && footer) {
                const footerTop = footer.getBoundingClientRect().top;
                if (footerTop < windowHeight - 150) {
                    textTarget.classList.add('footer-bg');
                } else {
                    textTarget.classList.remove('footer-bg');
                }
            }
        }

        function openNaverBlog() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            let blogUrl = isMobile 
                ? "https://m.blog.naver.com/zinux_?noTrackingCode=true&proxyReferer=&tab=1" 
                : "https://blog.naver.com/zinux_";
            window.open(blogUrl, '_blank');
        }

        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            for (var i = 0; i < reveals.length; i++) {
                var windowHeight = window.innerHeight;
                var elementTop = reveals[i].getBoundingClientRect().top;
                if (elementTop < windowHeight - 100) {
                    reveals[i].classList.add("active");
                }
            }
            checkScrollContact();
        }

        window.addEventListener("scroll", reveal);
        window.addEventListener('resize', checkScrollContact);
        
        setTimeout(checkScrollContact, 400);

    </script>
</body>

</html>
