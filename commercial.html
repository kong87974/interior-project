<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE DESIGN | 상업공간</title>

    <link rel="icon" href="https://i.imgur.com/f1j8a7x.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Pretendard", sans-serif;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }

        img {
            display: block;
            max-width: 100%;
        }

        /* 탭 링크 스타일 일치 */
        .tab-link {
            position: relative;
            padding-bottom: 8px;
            transition: all 0.3s;
        }

        .tab-link.active {
            color: #1e3a8a;
            font-weight: bold;
        }

        .tab-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #1e3a8a;
        }

        /* 히어로 배경 앤업 스무스 슬라이딩 */
        .hero-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 스크롤 트리거 애니메이션 */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 우측 고정 연락처 제어 */
        .dynamic-contact-text {
            color: #162e59;
            transition: color 0.3s ease;
        }
        .dynamic-contact-text.footer-bg {
            color: #ffffff !important;
        }

        /* 페이지네이션 원형 버튼 통일 규격 */
        .page-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
            color: #6b7280;
            transition: all 0.3s;
            cursor: pointer;
        }
        .page-btn:hover {
            background-color: #f3f4f6;
            color: #111827;
        }
        .page-btn.active {
            background-color: #1e3a8a;
            color: white;
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 38px !important;
            }

            .hero-desc {
                font-size: 14px !important;
                line-height: 1.8;
            }

            .tab-wrap {
                gap: 32px !important;
            }

            .project-grid {
                grid-template-columns: 1fr !important;
                gap-y: 40px !important;
            }

            .contact-box { right: 20px !important; bottom: 20px !important; }
            .contact-box p:first-child { font-size: 16px !important; }
        }
    </style>
</head>

<body class="bg-white text-gray-900">

    <div id="header"></div>

    <section class="relative h-[400px] w-full flex items-center justify-center text-white overflow-hidden bg-black">
        <div class="absolute inset-0 z-0">
            <img src="https://imgur.com/Wzg5gzw.jpg"
                class="w-full h-full object-cover brightness-[0.4]">
        </div>

        <div class="absolute inset-0 z-10 flex flex-col items-center justify-center px-6">
            <div class="hero-fade-in-up text-center w-full max-w-2xl">
                <h1 class="hero-title text-4xl md:text-5xl font-bold tracking-tight mb-6 uppercase">
                    상업공간
                </h1>
                <p class="hero-desc text-sm md:text-base text-gray-200 leading-relaxed"
                    style="transition-delay: 0.1s;">
                    브랜드의 분위기와 고객 경험을 고려한<br>감각적인 상업 공간 디자인을 제안합니다.
                </p>
            </div>
        </div>
    </section>

    <div class="border-b border-gray-100 mb-16">
        <div class="tab-wrap max-w-[1400px] mx-auto flex justify-center gap-12 py-6 text-[14px] font-medium text-gray-400">
            <a href="project_all.html" class="tab-link">전체보기</a>
            <a href="office.html" class="tab-link">사무공간</a>
            <a href="commercial.html" class="tab-link active">상업공간</a>
        </div>
    </div>

    <main class="max-w-[1400px] mx-auto px-6 pb-32">
        <div id="commercialProjectGrid" class="project-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-10 min-h-[300px]">
            </div>

        <div id="pagination-container" class="flex justify-center gap-2 mt-20">
            </div>
    </main>

    <div class="contact-box fixed bottom-10 right-10 z-[99999] flex flex-col items-end select-none">
        <div id="dynamic-text-target" class="dynamic-contact-text mb-5 flex flex-col items-end text-right">
            <p class="text-[21px] font-black tracking-tighter">010-4192-0882</p>
            <p class="text-sm font-light opacity-90 tracking-[0.055em] mr-[-0.055em]">camp0882@daum.net</p>
        </div>
        <div class="flex justify-end gap-3">
            <a href="javascript:void(0);" onclick="openNaverBlog();" class="w-10 h-10 rounded-full bg-[#03C75A] flex items-center justify-center text-white text-[10px] font-bold uppercase hover:scale-105 shadow-lg transition-transform">
                BLOG
            </a>
            
            <a href="http://pf.kakao.com/_AJxenX" target="_blank" rel="noopener noreferrer" class="w-10 h-10 rounded-full bg-[#fae100] flex items-center justify-center overflow-hidden hover:scale-105 shadow-lg transition-transform">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/KakaoTalk_logo.svg" alt="카카오톡" class="w-5 h-5 object-contain">
            </a>

            <a href="javascript:void(0);" onclick="copyEmail();" class="w-10 h-10 rounded-full bg-white border border-gray-100 flex items-center justify-center text-[#1e3a8a] hover:scale-105 shadow-lg transition-transform" title="이메일 주소 복사">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
            </a>
        </div>
    </div>

    <div id="footer"></div>

    <script>
        const commercialProjects = [
            {
                title: "[수원] 아구찜 음식점 인테리어",
                tag: "상업공간 / 철거 & 인테리어",
                img: "https://imgur.com/2MwxLjF.jpg", 
                link: "commercial_detail_01.html"
            }
        ];

        const itemsPerPage = 9;
        let currentPage = 1;

        function renderCommercialProjects(page) {
            const container = document.getElementById('commercialProjectGrid');
            if(!container) return;

            container.innerHTML = "";

            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentItems = commercialProjects.slice(startIndex, endIndex);

            currentItems.forEach(project => {
                const html = `
                    <a href="${project.link}" class="project-card group block reveal">
                        <div class="overflow-hidden bg-gray-100 aspect-video mb-6 rounded-lg shadow-sm">
                            <img src="${project.img}"
                                class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-105"
                                alt="${project.title}">
                        </div>
                        <div>
                            <h3 class="text-xl font-bold tracking-tight group-hover:text-[#1e3a8a] transition-colors mb-1.5">
                                ${project.title}
                            </h3>
                            <p class="text-[13px] text-[#1e3a8a] font-bold tracking-widest uppercase">
                                ${project.tag}
                            </p>
                        </div>
                    </a>
                `;
                container.innerHTML += html;
            });

            setTimeout(reveal, 100);
        }

        function renderPagination() {
            const totalPages = Math.ceil(commercialProjects.length / itemsPerPage);
            const paginationContainer = document.getElementById('pagination-container');
            if(!paginationContainer) return;

            paginationContainer.innerHTML = "";
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('div');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                
                btn.addEventListener('click', () => {
                    currentPage = i;
                    renderCommercialProjects(currentPage);
                    renderPagination();
                    window.scrollTo({ top: 400, behavior: 'smooth' }); 
                });

                paginationContainer.appendChild(btn);
            }
        }

        renderCommercialProjects(currentPage);
        renderPagination();

        fetch('./components/header.html')
            .then(res => res.text())
            .then(data => { document.getElementById('header').innerHTML = data; });

        fetch('./components/footer.html')
            .then(res => res.text())
            .then(data => { document.getElementById('footer').innerHTML = data; });

// 기존에 있던 window.toggleMenu = function() { ... } 부분을 아래 코드로 교체하세요!

window.toggleComponentMenu = function () {
    const menu = document.getElementById("componentMobileMenu");
    if(menu) {
        menu.classList.toggle("hidden");
    }
};

        function checkScrollContact() {
            const windowHeight = window.innerHeight;
            const textTarget = document.getElementById('dynamic-text-target');
            const footer = document.getElementById('footer');

            if (textTarget && footer) {
                const footerTop = footer.getBoundingClientRect().top;
                if (footerTop < windowHeight - 150) {
                    textTarget.classList.add('footer-bg');
                } else {
                    textTarget.classList.remove('footer-bg');
                }
            }
        }

        function openNaverBlog() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            let blogUrl = isMobile ? "https://m.blog.naver.com/zinux_?noTrackingCode=true&proxyReferer=&tab=1" : "https://blog.naver.com/zinux_";
            window.open(blogUrl, '_blank');
        }

        // 이메일 복사 함수
        window.copyEmail = function() {
            const email = "camp0882@daum.net";
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(email).then(() => {
                    alert("이메일 주소(" + email + ")가 복사되었습니다.");
                }).catch(() => fallbackCopyTextToClipboard(email));
            } else {
                fallbackCopyTextToClipboard(email);
            }
        };

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "absolute";
            textArea.style.left = "-999999px"; 
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    alert("이메일 주소(" + text + ")가 복사되었습니다.");
                } else {
                    alert("복사 실패. 이메일 주소를 직접 복사해주세요: " + text);
                }
            } catch (err) {
                alert("이 환경에서는 복사가 지원되지 않습니다: " + text);
            }
            
            document.body.removeChild(textArea);
        }

        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            for (var i = 0; i < reveals.length; i++) {
                var windowHeight = window.innerHeight;
                var elementTop = reveals[i].getBoundingClientRect().top;
                if (elementTop < windowHeight - 50) {
                    reveals[i].classList.add("active");
                }
            }
            checkScrollContact();
        }

        window.addEventListener("scroll", reveal);
        window.addEventListener('resize', checkScrollContact);
        setTimeout(checkScrollContact, 400);
    </script>
</body>
</html>
