<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE DESIGN | 상업공간</title>

    <link rel="icon" href="https://i.imgur.com/f1j8a7x.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Pretendard", sans-serif;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }

        img {
            display: block;
            max-width: 100%;
        }

        /* TAB ACTIVE STYLE */
        .tab-link {
            position: relative;
            padding-bottom: 8px;
            transition: all 0.3s;
        }

        .tab-link.active {
            color: #1e3a8a;
            font-weight: bold;
        }

        .tab-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #1e3a8a;
        }

        /* REVEAL */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* ✨ 우측 하단 연락처 글자 색상 실시간 제어 스타일 */
        .dynamic-contact-text {
            color: #162e59;
            transition: color 0.3s ease;
        }
        /* 푸터 진입 시 반전될 흰색 클래스 */
        .dynamic-contact-text.footer-bg {
            color: #ffffff !important;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 36px !important;
            }

            .hero-desc {
                font-size: 14px !important;
                line-height: 1.8;
            }

            .tab-wrap {
                gap: 32px !important; /* 모바일 메뉴 간격 통일 */
                font-size: 14px !important; /* 모바일 탭 글씨 크기 스케일 매칭 */
            }

            .project-info {
                flex-direction: column;
                gap: 10px;
            }

            .project-title {
                font-size: 22px !important;
            }

            .contact-box { right: 20px !important; bottom: 20px !important; }
            .contact-box p:first-child { font-size: 16px !important; }

            footer {
                text-align: center;
            }

            .footer-bottom {
                flex-direction: column;
                gap: 20px;
                align-items: center !important;
            }
        }
    </style>
</head>

<body class="bg-white text-gray-900">

    <div id="header"></div>

    <section class="relative h-[500px] flex items-center justify-center text-white overflow-hidden">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?q=80&w=2000"
                class="w-full h-full object-cover brightness-[0.4]">
        </div>

        <div class="relative z-10 text-center px-6">
            <h1 class="hero-title text-5xl md:text-6xl font-black tracking-tighter mb-6 reveal">
                상업공간
            </h1>
            <p class="hero-desc max-w-2xl mx-auto text-sm md:text-base text-gray-200 leading-relaxed reveal"
                style="transition-delay: 0.1s;">
                브랜드의 분위기와 고객 경험을 고려한<br>감각적인 상업 공간 디자인을 제안합니다.
            </p>
        </div>
    </section>

    <section class="border-b border-gray-100">
        <div class="max-w-[1400px] mx-auto px-6">
            <div class="tab-wrap flex justify-center gap-16 py-6 text-[17px] font-bold tracking-wide">
                <a href="project_all.html" class="tab-link text-gray-400 hover:text-black transition-colors">
                    전체보기
                </a>
                <a href="office.html" class="tab-link text-gray-400 hover:text-black transition-colors">
                    사무공간
                </a>
                <a href="commercial.html" class="tab-link active">
                    상업공간
                </a>
            </div>
        </div>
    </section>

    <section class="py-40 bg-white text-center">
        <div class="max-w-[1400px] mx-auto px-6 reveal">
            <p class="text-gray-400 text-sm tracking-wide font-light">
                현재 등록된 상업공간 포트폴리오가 없습니다.
            </p>
        </div>
    </section>

    <section class="py-28 bg-[#f8fafc]">
        <div class="max-w-[1000px] mx-auto px-6 text-center reveal">
            <h2 class="text-3xl md:text-5xl font-black tracking-tighter mb-6">
                공간이 브랜드의 첫인상입니다
            </h2>
            <p class="text-gray-500 leading-relaxed mb-10">
                블루디자인은 고객 경험과 브랜드 아이덴티티를 고려한 프리미엄 상업 공간을 제안합니다.
            </p>
            <a href="contact.html"
                class="inline-flex items-center justify-center px-8 h-14 bg-[#1e3a8a] text-white text-sm font-bold tracking-widest uppercase hover:opacity-90 transition-all">
                CONTACT US
            </a>
        </div>
    </section>

    <div class="contact-box fixed bottom-10 right-10 z-[99999] flex flex-col items-end select-none">
        <div id="dynamic-text-target" class="dynamic-contact-text mb-5 flex flex-col items-end text-right">
            <p class="text-[21px] font-black tracking-tighter">010-4192-0882</p>
            <p class="text-sm font-light opacity-90 tracking-[0.055em] mr-[-0.055em]">camp0882@daum.net</p>
        </div>
        <div class="flex justify-end gap-3">
            <a href="javascript:void(0);" onclick="openNaverBlog();" class="w-10 h-10 rounded-full bg-[#03C75A] flex items-center justify-center text-white text-[10px] font-bold uppercase hover:scale-105 shadow-lg transition-transform">
                BLOG
            </a>
            <a href="http://pf.kakao.com/_AJxenX" class="w-10 h-10 rounded-full bg-[#fae100] flex items-center justify-center overflow-hidden hover:scale-105 shadow-lg transition-transform">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/KakaoTalk_logo.svg" alt="카카오톡" class="w-5 h-5 object-contain">
            </a>
        </div>
    </div>

    <div id="footer"></div>

    <script>
        // header/footer 불러오기
        fetch('./components/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
            });

        fetch('./components/footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });

        window.toggleMenu = function () {
            const menu = document.getElementById("mobileMenu");
            if (menu) {
                menu.classList.toggle("hidden");
            }
        };
        
        function checkScrollContact() {
            const windowHeight = window.innerHeight;
            const textTarget = document.getElementById('dynamic-text-target');
            const footer = document.getElementById('footer');

            if (textTarget && footer) {
                const footerTop = footer.getBoundingClientRect().top;
                if (footerTop < windowHeight - 150) {
                    textTarget.classList.add('footer-bg');
                } else {
                    textTarget.classList.remove('footer-bg');
                }
            }
        }

        function openNaverBlog() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            let blogUrl = "";
            if (isMobile) {
                blogUrl = "https://m.blog.naver.com/zinux_?noTrackingCode=true&proxyReferer=&tab=1";
            } else {
                blogUrl = "https://blog.naver.com/zinux_";
            }
            
            window.open(blogUrl, '_blank');
        }

        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            for (var i = 0; i < reveals.length; i++) {
                var windowHeight = window.innerHeight;
                var elementTop = reveals[i].getBoundingClientRect().top;
                if (elementTop < windowHeight - 100) {
                    reveals[i].classList.add("active");
                }
            }
            checkScrollContact();
        }

        window.addEventListener("scroll", reveal);
        window.addEventListener('resize', checkScrollContact);
        
        reveal();
        setTimeout(checkScrollContact, 400);
    </script>
</body>

</html>
