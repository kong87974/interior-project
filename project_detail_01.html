<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE DESIGN | 전체 프로젝트</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        body {
            font-family: "Pretendard", sans-serif;
            overflow-x: hidden;
        }
    </style>
</head>

<body class="bg-white text-gray-900">

    <div id="header"></div>

    <main class="min-h-screen">

        <section class="max-w-[1400px] mx-auto px-6 py-20">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div class="overflow-hidden">
                    <img src="https://imgur.com/HBTjbpu.jpg"
                        alt="project image 1"
                        class="w-full h-full object-cover hover:scale-105 transition duration-700">
                </div>

                <div class="https://imgur.com/U1XBpZV.jpg">
                    <img src=""
                        alt="project image 2"
                        class="w-full h-full object-cover hover:scale-105 transition duration-700">
                </div>

                <div class="overflow-hidden">
                    <img src="https://imgur.com/F0mtgsj.jpg"
                        alt="project image 3"
                        class="w-full h-full object-cover hover:scale-105 transition duration-700">
                </div>

                <div class="overflow-hidden">
                    <img src="https://imgur.com/nAyfPQI.jpg"
                        alt="project image 4"
                        class="w-full h-full object-cover hover:scale-105 transition duration-700">
                </div>

            </div>

        </section>

    </main>

    <div id="footer"></div>

    <script>

        // header
        fetch('./components/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
            });

        // footer
        fetch('./components/footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });

        window.toggleMenu = function () {
            const menu = document.getElementById("mobileMenu");
            if (menu) {
                menu.classList.toggle("hidden");
            }
        };

    </script>

</body>

</html>
