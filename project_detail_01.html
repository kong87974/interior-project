<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUE DESIGN | 전체 프로젝트</title>

    <link rel="icon" href="https://i.imgur.com/f1j8a7x.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        body {
            font-family: "Pretendard", sans-serif;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }
    </style>
</head>

<body class="bg-white text-gray-900">

    <div id="header"></div>

    <main class="min-h-screen pt-32">

        <section class="max-w-[1400px] mx-auto px-6 py-20">
            
            <div class="mb-16 text-center">
                <p class="text-[11px] text-[#1e3a8a] font-bold tracking-[0.3em] uppercase mb-3">Office Interior</p>
                <h1 class="text-3xl md:text-4xl font-bold tracking-tighter">동탄 노무사 인테리어</h1>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <a href="project_detail_01.html" class="relative overflow-hidden aspect-[4/3] group cursor-pointer block">
                    <img src="https://imgur.com/HBTjbpu.jpg"
                        alt="project image 1"
                        class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex flex-col justify-end p-8 text-white">
                        <span class="text-xs uppercase tracking-widest text-gray-300 mb-1">Office Space</span>
                        <h3 class="text-xl font-bold tracking-tight">경기도 간호조무사회</h3>
                    </div>
                </a>

                <a href="project_detail_02.html" class="relative overflow-hidden aspect-[4/3] group cursor-pointer block">
                    <img src="https://imgur.com/U1XBpZV.jpg"
                        alt="project image 2"
                        class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex flex-col justify-end p-8 text-white">
                        <span class="text-xs uppercase tracking-widest text-gray-300 mb-1">Commercial Space</span>
                        <h3 class="text-xl font-bold tracking-tight">모던 미니멀 라운지 카페</h3>
                    </div>
                </a>

                <a href="project_detail_03.html" class="relative overflow-hidden aspect-[4/3] group cursor-pointer block">
                    <img src="https://imgur.com/F0mtgsj.jpg"
                        alt="project image 3"
                        class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex flex-col justify-end p-8 text-white">
                        <span class="text-xs uppercase tracking-widest text-gray-300 mb-1">Office Space</span>
                        <h3 class="text-xl font-bold tracking-tight">프리미엄 크리에이티브 스튜디오</h3>
                    </div>
                </a>

                <a href="project_detail_04.html" class="relative overflow-hidden aspect-[4/3] group cursor-pointer block">
                    <img src="https://imgur.com/nAyfPQI.jpg"
                        alt="project image 4"
                        class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex flex-col justify-end p-8 text-white">
                        <span class="text-xs uppercase tracking-widest text-gray-300 mb-1">Commercial Space</span>
                        <h3 class="text-xl font-bold tracking-tight">복합 문화 오산 프리미어캠퍼스</h3>
                    </div>
                </a>

            </div>

        </section>

    </main>

    <div id="footer"></div>

    <script>
        // header
        fetch('./components/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
            });

        // footer
        fetch('./components/footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });

        window.toggleMenu = function () {
            const menu = document.getElementById("mobileMenu");
            if (menu) {
                menu.classList.toggle("hidden");
            }
        };
    </script>

</body>

</html>
