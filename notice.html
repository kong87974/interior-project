<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BLUE DESIGN | 공지사항</title>

    <link rel="icon" href="https://i.imgur.com/f1j8a7x.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        body {
            font-family: "Pretendard", sans-serif;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }

        /* 공지 hover */
        .notice-row {
            transition: all 0.3s ease;
        }

        .notice-row:hover {
            background-color: #fcfdff;
        }

        /* CSS 단독 애니메이션 */
        .hero-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 하단 본문 스크롤 애니메이션 */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 38px !important;
            }
            .hero-sub {
                font-size: 14px !important;
                line-height: 1.8;
            }
        }
    </style>
</head>

<body class="bg-white text-gray-900">

    <div id="header"></div>

    <section class="relative h-[400px] w-full text-white overflow-hidden bg-black">

        <div class="absolute inset-0 z-0">
            <img src="https://imgur.com/8aK6Xjn.jpg"
                class="w-full h-full object-cover brightness-[0.4]" />
        </div>

        <div class="absolute inset-0 z-10 flex flex-col items-center justify-center px-6">
            
            <div class="hero-fade-in-up text-center w-full max-w-2xl">
                <h1 class="hero-title text-4xl md:text-5xl font-bold tracking-tight mb-4 uppercase">
                    공지사항
                </h1>

                <p class="hero-sub text-sm md:text-base text-gray-200 leading-relaxed">
                    블루디자인의 새로운 소식을 전해드립니다.
                </p>
            </div>

        </div>

    </section>

    <main class="max-w-[1100px] mx-auto px-6 pt-20 pb-40">

        <div class="hidden md:flex items-center pb-6 border-b-2 border-black text-[13px] font-bold uppercase tracking-wider px-4 reveal">
            <div class="w-20 text-center">No</div>
            <div class="flex-1 px-10">Subject</div>
            <div class="w-32 text-center">Date</div>
        </div>

        <div class="divide-y divide-gray-100">
            <a href="notice_01.html" class="notice-row flex flex-col md:flex-row items-center py-8 px-4 group reveal">
                <div class="hidden md:block w-20 text-center text-xs text-gray-400 font-medium">01</div>
                <div class="flex-1 md:px-10 mb-2 md:mb-0 w-full md:w-auto">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="bg-[#1e3a8a] text-[10px] text-white px-2 py-0.5 font-bold uppercase tracking-tighter">
                            Notice
                        </span>
                    </div>
                    <h3 class="text-[16px] font-bold tracking-tight group-hover:text-[#1e3a8a] transition-colors leading-snug">
                        블루디자인 공식 홈페이지가 새롭게 리뉴얼 되었습니다.
                    </h3>
                </div>
                <div class="w-full md:w-32 text-left md:text-center text-xs text-gray-400">2026.05.05</div>
            </a>
        </div>

        <div class="mt-20 flex justify-center gap-2 reveal">
            <span class="w-8 h-8 flex items-center justify-center bg-[#1e3a8a] text-white text-xs">1</span>
        </div>

    </main>

    <div id="footer"></div>

    <script>
        // header/footer 불러오기
        fetch('./components/header.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('header').innerHTML = data;
        });

        fetch('./components/footer.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        });

// 기존에 있던 window.toggleMenu = function() { ... } 부분을 아래 코드로 교체하세요!

window.toggleComponentMenu = function () {
    const menu = document.getElementById("componentMobileMenu");
    if(menu) {
        menu.classList.toggle("hidden");
    }
};

        function toggleMenu() {
            const menu = document.getElementById("mobileMenu");
            if(menu){
                menu.classList.toggle("hidden");
            }
        }

        // 스크롤 리빌 애니메이션
        window.addEventListener('scroll', () => {
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach(el => {
                const windowHeight = window.innerHeight;
                const revealTop = el.getBoundingClientRect().top;

                if (revealTop < windowHeight - 100) {
                    el.classList.add('active');
                }
            });
        });

        window.dispatchEvent(new Event('scroll'));
    </script>

</body>
</html>
