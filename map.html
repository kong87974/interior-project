<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BLUE DESIGN | 오시는 길</title>

    <link rel="icon" href="https://i.imgur.com/f1j8a7x.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        as="style"
        crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Pretendard", sans-serif;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }

        .branch-card {
            transition: 0.3s;
            cursor: pointer;
        }

        .branch-card.active {
            border-color: #1e3a8a;
            background: #f8fafc;
        }

        .branch-card.active h3 {
            color: #1e3a8a;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* ✨ 우측 하단 연락처 글자 색상 실시간 제어 스타일 */
        .dynamic-contact-text {
            color: #162e59;
            transition: color 0.3s ease;
        }
        .dynamic-contact-text.footer-bg {
            color: #ffffff !important;
        }

        @media (max-width: 768px) {
            main {
                padding-top: 130px !important;
            }

            .map-wrap {
                height: 350px !important;
            }
            
            .contact-box { right: 20px !important; bottom: 20px !important; }
            .contact-box p:first-child { font-size: 16px !important; }
        }
    </style>
</head>

<body class="bg-white text-gray-900">

    <div id="header"></div>

    <main class="pt-48 pb-32">

        <div class="max-w-[1400px] mx-auto px-6">

            <section class="mb-20">

                <p class="text-[11px] tracking-[0.4em] text-[#1e3a8a] font-bold uppercase mb-5">
                    Location
                </p>

                <h1 class="text-4xl md:text-5xl font-black tracking-tighter mb-6">
                    오시는 길
                </h1>

                <p class="text-gray-500 leading-relaxed text-[15px] md:text-[17px]">
                    블루디자인의 각 지점을 안내드립니다.<br>
                    가까운 지점을 선택하여 위치를 확인해보세요.
                </p>

            </section>

            <section class="mb-16">

                <div class="map-wrap w-full h-[550px] overflow-hidden border border-gray-100">

                    <iframe
                        id="mapFrame"
                        src="https://map.naver.com/v5/search/%EA%B2%BD%EA%B8%B0%EB%8F%84%20%EC%98%A4%EC%82%B0%EC%8B%9C%20%EA%B2%BD%EA%B8%B0%EB%8C%80%EB%A1%9C%20761%EB%B2%88%EA%B8%B0%2030?entry=thu&embed=1&panel=0&scale=false"
                        loading="lazy">
                    </iframe>

                </div>

            </section>

            <section class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div
                    class="branch-card active border border-gray-200 p-8 pt-9"
                    onclick="changeBranch(
                        this,
                        '세마점',
                        '경기도 오산시 경기대로 761번길 30 현대프리미어캠퍼스 A-D-B2-029호',
                        'https://map.naver.com/v5/search/%EA%B2%BD%EA%B8%B0%EB%8F%84%20%EC%98%A4%EC%82%B0%EC%8B%9C%20%EA%B2%BD%EA%B8%B0%EB%8C%80%EB%A1%9C%20761%EB%B2%88%EA%B8%B0%2030?entry=thu&embed=1&panel=0&scale=false'
                    )">

                    <h3 class="text-2xl font-black tracking-tight mb-5">
                        세마점
                    </h3>

                    <p class="text-sm text-gray-500 leading-relaxed">
                        경기도 오산시 경기대로 761번길 30<br>
                        현대프리미어캠퍼스 A-D-B2-029호
                    </p>

                </div>

                <div
                    class="branch-card border border-gray-200 p-8 pt-9"
                    onclick="changeBranch(
                        this,
                        '세교점',
                        '경기도 오산시 독산성로 425 더퍼스트타워세교 426호',
                        'https://map.naver.com/v5/search/%EA%B2%BD%EA%B8%B0%EB%8F%84%20%EC%98%A4%EC%82%B0%EC%8B%9C%20%EB%8F%85%EC%82%B0%EC%84%B1%EB%A1%9C%20425?entry=thu&embed=1&panel=0&scale=false'
                    )">

                    <h3 class="text-2xl font-black tracking-tight mb-5">
                        세교점
                    </h3>

                    <p class="text-sm text-gray-500 leading-relaxed">
                        경기도 오산시 독산성로 425<br>
                        더퍼스트타워세교 426호
                    </p>

                </div>

            </section>

        </div>

    </main>

    <div class="contact-box fixed bottom-10 right-10 z-[99999] flex flex-col items-end select-none">
        <div id="dynamic-text-target" class="dynamic-contact-text mb-5 flex flex-col items-end text-right">
            <p class="text-[21px] font-black tracking-tighter">010-4192-0882</p>
            <p class="text-sm font-light opacity-90 tracking-[0.055em] mr-[-0.055em]">camp0882@daum.net</p>
        </div>
        <div class="flex justify-end gap-3">
            <a href="javascript:void(0);" onclick="openNaverBlog();" class="w-10 h-10 rounded-full bg-[#03C75A] flex items-center justify-center text-white text-[10px] font-bold uppercase hover:scale-105 shadow-lg transition-transform">
                BLOG
            </a>
            <a href="http://pf.kakao.com/_AJxenX" class="w-10 h-10 rounded-full bg-[#fae100] flex items-center justify-center overflow-hidden hover:scale-105 shadow-lg transition-transform">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/KakaoTalk_logo.svg" alt="카카오톡" class="w-5 h-5 object-contain">
            </a>
        </div>
    </div>

    <div id="footer"></div>

    <script>
        // 모바일 메뉴 토글
        window.toggleMenu = function () {
            const menu = document.getElementById("mobileMenu");
            if(menu){
                menu.classList.toggle("hidden");
            }
        };

        // components 연동
        fetch('./components/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
            });

        fetch('./components/footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });

        // 지점 변경 및 지도 동적 스위칭 함수
        function changeBranch(el, title, address, mapUrl) {
            document.querySelectorAll('.branch-card').forEach(card => {
                card.classList.remove('active');
            });

            el.classList.add('active');
            document.getElementById('mapFrame').src = mapUrl;
        }

        // 스크롤 감지 푸터 색상 제어
        function checkScrollContact() {
            const windowHeight = window.innerHeight;
            const textTarget = document.getElementById('dynamic-text-target');
            const footer = document.getElementById('footer');

            if (textTarget && footer) {
                const footerTop = footer.getBoundingClientRect().top;
                if (footerTop < windowHeight - 150) {
                    textTarget.classList.add('footer-bg');
                } else {
                    textTarget.classList.remove('footer-bg');
                }
            }
        }

        // 블로그 링크 분기 처리
        function openNaverBlog() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            let blogUrl = isMobile 
                ? "https://m.blog.naver.com/zinux_?noTrackingCode=true&proxyReferer=&tab=1" 
                : "https://blog.naver.com/zinux_";
            window.open(blogUrl, '_blank');
        }

        window.addEventListener('scroll', checkScrollContact);
        window.addEventListener('resize', checkScrollContact);
        setTimeout(checkScrollContact, 400);
    </script>

</body>
</html>
