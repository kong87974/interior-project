<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BLUE DESIGN | 오시는 길</title>

    <link rel="icon" href="https://i.imgur.com/f1j8a7x.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        as="style"
        crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Pretendard", sans-serif;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }

        .branch-card {
            transition: 0.3s;
            cursor: pointer;
        }

        .branch-card.active {
            border-color: #1e3a8a;
            background: #f8fafc;
        }

        .branch-card.active h3 {
            color: #1e3a8a;
        }

        /* PC / 모바일 지도 스위칭용 핵심 CSS */
        .map-layer { display: none; width: 100%; height: 100%; }
        
        /* 선택된(active) 지점만 노출 */
        .map-layer.active.is-pc { display: none; }
        .map-layer.active.is-mobile { display: block; }

        @media (min-width: 768px) {
            .map-layer.active.is-pc { display: block; }
            .map-layer.active.is-mobile { display: none; }
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .dynamic-contact-text {
            color: #162e59;
            transition: color 0.3s ease;
        }
        .dynamic-contact-text.footer-bg {
            color: #ffffff !important;
        }

        @media (max-width: 768px) {
            main {
                padding-top: 110px !important;
                height: auto !important;
                min-height: 0 !important;
            }

            .map-wrap {
                height: 320px !important;
            }
            
            .contact-box { right: 20px !important; bottom: 20px !important; }
            .contact-box p:first-child { font-size: 16px !important; }
        }
    </style>
</head>

<body class="bg-white text-gray-900">

    <div id="header"></div>

    <main class="pt-32 pb-4 min-h-[calc(100vh-80px)] flex flex-col justify-between">

        <div class="max-w-[1400px] mx-auto px-6 w-full flex-grow flex flex-col justify-center">

            <section class="mb-10">
                <p class="text-[11px] tracking-[0.4em] text-[#1e3a8a] font-bold uppercase mb-3">
                    Location
                </p>

                <h1 class="text-3xl font-black tracking-tighter mb-4">
                    오시는 길
                </h1>

                <p class="text-gray-500 leading-relaxed text-[14px] md:text-[15px]">
                    블루디자인의 각 지점을 안내해 드립니다.<br>
                    가까운 지점을 선택하여 위치를 확인해 보세요.
                </p>
            </section>

            <section class="mb-6">
                <div class="map-wrap w-full h-[480px] overflow-hidden border border-gray-100 rounded-sm shadow-sm relative">
                    
                    <div id="sema-pc" class="map-layer active is-pc">
                        <iframe src="https://map.naver.com/v5/search/%EA%B2%BD%EA%B8%B0%EB%8F%84%20%EC%98%A4%EC%82%B0%EC%8B%9C%20%EA%B2%BD%EA%B8%B0%EB%8C%80%EB%A1%9C%20761%EB%B2%88%EA%B8%B0%2030?entry=thu&embed=1&panel=0&scale=false" loading="lazy"></iframe>
                    </div>

                    <div id="sema-mobile" class="map-layer active is-mobile">
                        <iframe src="https://maps.google.com/maps?q=%EA%B2%BD%EA%B8%B0%EB%8F%84+%EC%98%A4%EC%82%B0%EC%8B%9C+%EA%B2%BD%EA%B8%B0%EB%8C%80%EB%A1%9C+761%EB%B2%88%EA%B8%B0+30&t=&z=16&ie=UTF8&iwloc=&output=embed" loading="lazy"></iframe>
                    </div>

                    <div id="segyo-pc" class="map-layer is-pc">
                        <iframe src="https://map.naver.com/v5/search/%EA%B2%BD%EA%B8%B0%EB%8F%84%20%EC%98%A4%EC%82%B0%EC%8B%9C%20%EB%8F%85%EC%82%B0%EC%84%B1%EB%A1%9C%20425?entry=thu&embed=1&panel=0&scale=false" loading="lazy"></iframe>
                    </div>

                    <div id="segyo-mobile" class="map-layer is-mobile">
                        <iframe src="https://maps.google.com/maps?q=%EA%B2%BD%EA%B8%B0%EB%8F%84+%EC%98%A4%EC%82%B0%EC%8B%9C+%EB%8F%85%EC%82%B0%EC%84%B1%EB%A1%9C+425&t=&z=16&ie=UTF8&iwloc=&output=embed" loading="lazy"></iframe>
                    </div>

                </div>
            </section>

            <section class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div class="branch-card active border border-gray-200 p-6 pt-7 rounded-sm hover:shadow-sm"
                    onclick="changeBranch(this, 'sema')">
                    <h3 class="text-xl font-black tracking-tight mb-3">세마점</h3>
                    <p class="text-[13.5px] md:text-[14.5px] text-gray-500 leading-relaxed break-keep">
                        경기도 오산시 경기대로 761번길 30 현대프리미어캠퍼스 A-D-B2-029호
                    </p>
                </div>

                <div class="branch-card border border-gray-200 p-6 pt-7 rounded-sm hover:shadow-sm"
                    onclick="changeBranch(this, 'segyo')">
                    <h3 class="text-xl font-black tracking-tight mb-3">세교점</h3>
                    <p class="text-[13.5px] md:text-[14.5px] text-gray-500 leading-relaxed break-keep">
                        경기도 오산시 독산성로 425 더퍼스트타워세교 426호
                    </p>
                </div>

            </section>

        </div>

        <div class="h-4 w-full"></div>

    </main>

    <div class="contact-box fixed bottom-10 right-10 z-[99999] flex flex-col items-end select-none">
        <div id="dynamic-text-target" class="dynamic-contact-text mb-5 flex flex-col items-end text-right">
            <p class="text-[21px] font-black tracking-tighter">010-4192-0882</p>
            <p class="text-sm font-light opacity-90 tracking-[0.055em] mr-[-0.055em]">camp0882@daum.net</p>
        </div>
        <div class="flex justify-end gap-3">
            <a href="javascript:void(0);" onclick="openNaverBlog();" class="w-10 h-10 rounded-full bg-[#03C75A] flex items-center justify-center text-white text-[10px] font-bold uppercase hover:scale-105 shadow-lg transition-transform">
                BLOG
            </a>
            
            <a href="http://pf.kakao.com/_AJxenX" target="_blank" rel="noopener noreferrer" class="w-10 h-10 rounded-full bg-[#fae100] flex items-center justify-center overflow-hidden hover:scale-105 shadow-lg transition-transform">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/KakaoTalk_logo.svg" alt="카카오톡" class="w-5 h-5 object-contain">
            </a>

            <a href="javascript:void(0);" onclick="copyEmail();" class="w-10 h-10 rounded-full bg-white border border-gray-100 flex items-center justify-center text-[#1e3a8a] hover:scale-105 shadow-lg transition-transform" title="이메일 주소 복사">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
            </a>
        </div>
    </div>

    <div id="footer"></div>

    <script>
        window.toggleComponentMenu = function () {
            const menu = document.getElementById("componentMobileMenu");
            if(menu) {
                menu.classList.toggle("hidden");
            }
        };

        fetch('./components/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
            });

        fetch('./components/footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });

        // 지도 탭 스위칭 (새로고침 없이 즉각 변경)
        function changeBranch(el, branchId) {
            document.querySelectorAll('.branch-card').forEach(card => card.classList.remove('active'));
            el.classList.add('active');
            
            document.querySelectorAll('.map-layer').forEach(layer => layer.classList.remove('active'));
            document.getElementById(branchId + '-pc').classList.add('active');
            document.getElementById(branchId + '-mobile').classList.add('active');
        }

        function checkScrollContact() {
            const windowHeight = window.innerHeight;
            const textTarget = document.getElementById('dynamic-text-target');
            const footer = document.getElementById('footer');

            if (textTarget && footer) {
                const footerTop = footer.getBoundingClientRect().top;
                if (footerTop < windowHeight - 150) {
                    textTarget.classList.add('footer-bg');
                } else {
                    textTarget.classList.remove('footer-bg');
                }
            }
        }

        function openNaverBlog() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            let blogUrl = isMobile 
                ? "https://m.blog.naver.com/zinux_?noTrackingCode=true&proxyReferer=&tab=1" 
                : "https://blog.naver.com/zinux_";
            window.open(blogUrl, '_blank');
        }

        window.copyEmail = function() {
            const email = "camp0882@daum.net";
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(email).then(() => {
                    alert("이메일 주소(" + email + ")가 복사되었습니다.");
                }).catch(() => fallbackCopyTextToClipboard(email));
            } else {
                fallbackCopyTextToClipboard(email);
            }
        };

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "absolute";
            textArea.style.left = "-999999px"; 
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    alert("이메일 주소(" + text + ")가 복사되었습니다.");
                } else {
                    alert("복사 실패. 이메일 주소를 직접 복사해주세요: " + text);
                }
            } catch (err) {
                alert("이 환경에서는 복사가 지원되지 않습니다: " + text);
            }
            
            document.body.removeChild(textArea);
        }

        window.addEventListener('scroll', checkScrollContact);
        window.addEventListener('resize', checkScrollContact);
        setTimeout(checkScrollContact, 400);
    </script>

</body>
</html>
